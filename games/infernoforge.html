<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inferno Forge — Endless Blacksmith</title>
<style>
:root{--bg:#0d0d0d;--panel:rgba(20,10,5,.88);--accent:#ff6a00;--accent2:#ff3d00;--gold:#fbbf24;--text:#f5f0e8;--muted:#b0a090}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at 50% 20%,#2a1200 0%,#0a0500 70%,#000 100%);color:var(--text);min-height:100vh;overflow-x:hidden;user-select:none}
canvas#emberCanvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrapper{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:12px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--panel);backdrop-filter:blur(16px);border-radius:16px;border:1px solid rgba(255,106,0,.2);margin-bottom:16px}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;transition:color .2s}
.back-btn:hover{color:var(--accent)}
.back-btn svg{width:16px;height:16px}
.title-group{text-align:center}
.title-group h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#ff6a00,#ff3d00,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.title-group span{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.header-right{display:flex;align-items:center;gap:8px}
.lang-select{background:rgba(255,255,255,.06);border:1px solid rgba(255,106,0,.25);color:var(--text);padding:6px 10px;border-radius:10px;font-size:12px;cursor:pointer;outline:none}
.resource-panel{background:var(--panel);border-radius:16px;border:1px solid rgba(255,106,0,.2);padding:16px 20px;text-align:center;margin-bottom:16px}
.resource-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}
.resource-amount{font-size:42px;font-weight:800;background:linear-gradient(180deg,#ff9d3c,#ff6a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.resource-rate{font-size:12px;color:var(--muted);margin-top:2px}
.forge-btn-wrap{text-align:center;margin-bottom:20px}
.forge-btn{width:140px;height:140px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#ff6a00,#8b2500);border:4px solid #ff9d3c;box-shadow:0 0 40px rgba(255,106,0,.4),inset 0 0 60px rgba(255,200,100,.1);cursor:pointer;transition:all .15s}
.forge-btn:active{transform:scale(.92);box-shadow:0 0 80px rgba(255,106,0,.7)}
.forge-btn .hammer{font-size:50px;transition:transform .1s}
.forge-btn:active .hammer{transform:rotate(-30deg)}
.forge-btn .click-hint{display:block;font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;font-weight:500}
.temper-bar-wrap{background:var(--panel);border-radius:12px;padding:10px 16px;margin-bottom:16px;border:1px solid rgba(255,106,0,.2)}
.temper-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.temper-fill{height:100%;background:linear-gradient(90deg,#ff3d00,#ff6a00,#fbbf24);border-radius:3px;transition:width .3s}
.upgrades-panel{background:var(--panel);border-radius:16px;border:1px solid rgba(255,106,0,.2);padding:16px;margin-bottom:16px}
.section-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px}
.upgrade-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}
.upgrade-list::-webkit-scrollbar{width:4px}
.upgrade-list::-webkit-scrollbar-thumb{background:rgba(255,106,0,.3);border-radius:2px}
.upgrade-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,106,0,.12);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .2s}
.upgrade-card:hover{border-color:rgba(255,106,0,.4);background:rgba(255,106,0,.06)}
.upgrade-icon{font-size:28px;flex-shrink:0}
.upgrade-info{flex:1}
.upgrade-name{font-size:13px;font-weight:600}
.upgrade-desc{font-size:10px;color:var(--muted)}
.upgrade-meta{text-align:right;flex-shrink:0}
.upgrade-count{font-size:11px;color:var(--muted)}
.upgrade-cost{font-size:12px;font-weight:700;color:var(--gold)}
.prestige-panel{background:var(--panel);border-radius:16px;border:1px solid rgba(255,106,0,.2);padding:16px;text-align:center}
.prestige-title{font-size:14px;font-weight:700;color:var(--accent2);margin-bottom:4px}
.prestige-desc{font-size:11px;color:var(--muted);margin-bottom:8px}
.prestige-gain{font-size:12px;color:var(--gold);margin-bottom:10px}
.prestige-btn{padding:10px 28px;background:linear-gradient(135deg,#ff3d00,#ff6a00);border:none;border-radius:25px;color:#fff;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 4px 16px rgba(255,61,0,.3)}
.prestige-btn:hover{transform:translateY(-2px)}
.prestige-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
footer{text-align:center;padding:16px;color:var(--muted);font-size:10px}
@media(max-width:600px){.forge-btn{width:110px;height:110px}.forge-btn .hammer{font-size:38px}.resource-amount{font-size:32px}header{flex-direction:column;align-items:stretch;text-align:center}}
</style></head><body><canvas id="emberCanvas"></canvas><div class="wrapper"><header><a href="../index.html" class="back-btn"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7 7-7m-7 7h18"/></svg><span id="lb">Back to Library</span></a><div class="title-group"><h1>INFERNO FORGE</h1><span id="ls">Endless Blacksmith</span></div><div class="header-right"><select class="lang-select" id="lg" onchange="cl(this.value)"><option value="en">EN</option><option value="hy">HY</option><option value="ru">RU</option><option value="es">ES</option><option value="fr">FR</option><option value="de">DE</option><option value="zh">ZH</option><option value="ja">JA</option><option value="it">IT</option><option value="pt">PT</option></select></div></header><div class="resource-panel"><div class="resource-label" id="lr">Embers</div><div class="resource-amount" id="vd">0</div><div class="resource-rate" id="rd">0.0 / sec</div></div><div class="forge-btn-wrap"><button class="forge-btn" onclick="ea(event)" id="fb"><span class="hammer">🔨</span><span class="click-hint" id="lc">FORGE!</span></button></div><div class="temper-bar-wrap" id="tp" style="display:none"><span id="ltm">🔥 Temper</span> <span id="tbs">x1.0</span><div class="temper-bar"><div class="temper-fill" id="tf" style="width:0%"></div></div></div><div class="upgrades-panel"><div class="section-title" id="lu">⚒️ UPGRADES</div><div class="upgrade-list" id="ul"></div></div><div class="prestige-panel"><div class="prestige-title" id="lp">🐦‍🔥 Phoenix Rebirth</div><div class="prestige-desc" id="lpd">Reset to gain Phoenix Feathers (+25% each).</div><div class="prestige-gain" id="pg">Feathers: 0</div><button class="prestige-btn" id="pst" onclick="dp()">Rebirth Now</button></div><footer>© 2026 AWEGame — Inferno Forge</footer></div><script>
const K='if_';const PB=0.25;const MF=1000;const CK=1;let ta=false,tt=null,tp=0;
const I=[{id:'an',bc:15,be:0.5,gr:1.15},{id:'ha',bc:100,be:3,gr:1.15},{id:'be',bc:600,be:12,gr:1.15},{id:'en',bc:3000,be:50,gr:1.15},{id:'cr',bc:15000,be:200,gr:1.15},{id:'ti',bc:80000,be:800,gr:1.15},{id:'so',bc:400000,be:3500,gr:1.15},{id:'et',bc:2e6,be:15000,gr:1.15}];
const IC=['🪨','🔨','💨','✨','💎','⚗️','👻','🔥'];
const L={
en:{b:'Back to Library',s:'Endless Blacksmith',r:'Embers',c:'FORGE!',rt:'/ sec',u:'⚒️ UPGRADES',p:'🐦‍🔥 Phoenix Rebirth',pd:'Reset to gain Phoenix Feathers (+25% each).',pb:'Rebirth Now',ep:'Feathers',tm:'🔥 Temper'},
hy:{b:'Վերադառնալ',s:'Անվերջ Դարբնոց',r:'Կայծեր',c:'ԿՌԻ՛Ր',rt:'/ վրկ',u:'⚒️ ԲԱՐԵԼԱՎՈՒՄՆԵՐ',p:'🐦‍🔥 Փյունիկի Վերածնունդ',pd:'Վերակայել +25% մնական:',pb:'Վերածնվել',ep:'Փետուրներ',tm:'🔥 Կոփում'},
ru:{b:'В библиотеку',s:'Бесконечная Кузница',r:'Угли',c:'КУЙ!',rt:'/ сек',u:'⚒️ УЛУЧШЕНИЯ',p:'🐦‍🔥 Возрождение Феникса',pd:'Сброс. +25% навсегда.',pb:'Возродиться',ep:'Перьев:',tm:'🔥 Закалка'},
es:{b:'Biblioteca',s:'Forja Infinita',r:'Brasas',c:'¡FORJA!',rt:'/ seg',u:'⚒️ MEJORAS',p:'🐦‍🔥 Renacimiento',pd:'Reinicia. +25% permanente.',pb:'Renacer',ep:'Plumas:',tm:'🔥 Temple'},
fr:{b:'Bibliothèque',s:'Forge Infinie',r:'Braises',c:'FORGE!',rt:'/ sec',u:'⚒️ AMÉLIORATIONS',p:'🐦‍🔥 Renaissance',pd:'Réinitialisez. +25%.',pb:'Renaître',ep:'Plumes:',tm:'🔥 Trempe'},
de:{b:'Bibliothek',s:'Endlose Schmiede',r:'Glut',c:'SCHMIEDE!',rt:'/ sek',u:'⚒️ VERBESSERUNGEN',p:'🐦‍🔥 Wiedergeburt',pd:'Zurücksetzen. +25%.',pb:'Wiedergeboren',ep:'Federn:',tm:'🔥 Härten'},
zh:{b:'游戏库',s:'无尽铁匠铺',r:'余烬',c:'锻造!',rt:'/ 秒',u:'⚒️ 升级',p:'🐦‍🔥 凤凰重生',pd:'重置。+25%永久。',pb:'重生',ep:'羽毛:',tm:'🔥 淬火'},
ja:{b:'ライブラリ',s:'無限の鍛冶場',r:'残り火',c:'鍛造!',rt:'/ 秒',u:'⚒️ アップグレード',p:'🐦‍🔥 転生',pd:'リセット。+25%。',pb:'転生',ep:'羽根:',tm:'🔥 焼き入れ'},
it:{b:'Libreria',s:'Forgia Infinita',r:'Braci',c:'FORGIA!',rt:'/ sec',u:'⚒️ POTENZIAMENTI',p:'🐦‍🔥 Rinascita',pd:'Azzera. +25%.',pb:'Rinasci',ep:'Piume:',tm:'🔥 Tempra'},
pt:{b:'Biblioteca',s:'Forja Infinita',r:'Brasas',c:'FORJAR!',rt:'/ seg',u:'⚒️ MELHORIAS',p:'🐦‍🔥 Renascimento',pd:'Redefina. +25%.',pb:'Renacer',ep:'Penas:',tm:'🔥 Têmpera'}};
let G,la,tx;
function DF(){return{v:0,tv:0,it:{},ep:0,tp:0,lang:'en'}}
function OB(){if(!ta&&G.tp%5===0)AT();}
function OP(){}
function XR(){}
function AT(){ta=true;tp=0;let s=Date.now();function tk(){if(!ta)return;let e=(Date.now()-s)/1000;tp=Math.min(1,e/8);let b=1+tp*2;document.getElementById('tp').style.display='block';document.getElementById('tf').style.width=(tp*100)+'%';document.getElementById('tbs').textContent='x'+b.toFixed(1);if(tp<1){tt=requestAnimationFrame(tk)}else{ET()}}tt=requestAnimationFrame(tk)}
function ET(){ta=false;cancelAnimationFrame(tt);document.getElementById('tp').style.display='none';tp=0}
function ea(e){let m=GM();if(ta&&tp>0)m*=(1+tp*2);G.v+=CK*m;G.tv+=CK*m;RN();SV(K,G);spawnSparks(e)}
function dp(){let f=Math.floor(Math.log2(G.tv/MF+1));if(f<1)return;if(!confirm(tx.pb+'? '+f+' '+tx.ep))return;G.ep+=f;G.v=0;G.tv=0;G.it={};G.tp=0;RN();SV(K,G)}
function cl(l){la=l;tx=L[l];G.lang=l;RN();SV(K,G)}
let cv,ctx,sp=[];
function initC(){cv=document.getElementById('emberCanvas');ctx=cv.getContext('2d');cv.width=window.innerWidth;cv.height=window.innerHeight}
function spawnSparks(e){let r=document.getElementById('fb').getBoundingClientRect();let cx=r.left+r.width/2,cy=r.top+r.height/2;for(let i=0;i<12;i++){sp.push({x:cx,y:cy,vx:(Math.random()-.5)*4,vy:(Math.random()-1)*6,l:1,s:2+Math.random()*4,c:`hsl(${20+Math.random()*30},100%,${50+Math.random()*50}%)`})}}
function animS(){ctx.clearRect(0,0,cv.width,cv.height);for(let i=sp.length-1;i>=0;i--){let s=sp[i];s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.l-=0.02;if(s.l<=0){sp.splice(i,1);continue}ctx.globalAlpha=s.l;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animS)}
G=LD(K,DF());la=G.lang||'en';tx=L[la];RN();initC();animS();
setInterval(()=>{if(G.v!==undefined){G.v+=TE()/10;G.tv+=TE()/10;RN();SV(K,G)}},100);
window.addEventListener('resize',()=>{if(cv){cv.width=window.innerWidth;cv.height=window.innerHeight}});
document.getElementById('lg').value=la;
</script></body></html>
