<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>CyberCore - Reactor Management Console</title>
    <style>
        /* ----- ROOT VARIABLES (unchanged) ----- */
        :root {
            --bg-color: #020617;
            --panel-bg: rgba(15, 23, 42, 0.8);
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --danger: #ff0055;
            --danger-glow: rgba(255, 0, 85, 0.5);
            --warning: #ffaa00;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 240, 255, 0.25);
        }

        /* ----- RESET & BASE ----- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ----- CANVAS (background) ----- */
        #gridCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ----- NAVBAR (responsive) ----- */
        .navbar {
            position: relative;
            z-index: 2;
            height: 65px;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.05);
            flex-shrink: 0;
            gap: 8px;
            flex-wrap: nowrap;
        }

        .btn-back {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-back:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
            transform: translateX(-2px);
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--primary-glow);
            text-align: center;
            flex: 1 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lang-select {
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.75rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            flex-shrink: 0;
            max-width: 110px;
        }
        .lang-select:hover {
            border-color: var(--primary);
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .lang-select option {
            background: #0f172a;
            color: #fff;
        }

        /* ----- APP LAYOUT (responsive grid) ----- */
        .app-container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 16px;
            padding: 16px;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        /* ----- PANELS ----- */
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s;
            min-width: 0;
        }

        .panel-header {
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .diag-content {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            flex: 1;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 12px 14px;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-color);
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.35rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
            word-break: break-word;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff 0%, #ffaa00 70%, #ff0055 100%);
            transition: width 0.3s ease;
        }

        /* ----- CENTER PANEL (Core) ----- */
        .center-panel {
            justify-content: space-between;
            align-items: center;
            padding: 20px 12px;
            position: relative;
            gap: 12px;
        }

        .reactor-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .reactor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px dashed var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
            animation: spin 20s linear infinite;
        }

        .reactor-core-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary) 0%, rgba(0, 240, 255, 0.25) 60%, transparent 100%);
            box-shadow: 0 0 45px var(--primary);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reactor-wrapper:hover .reactor-core-btn {
            box-shadow: 0 0 60px var(--primary);
        }
        .reactor-wrapper:active .reactor-core-btn {
            transform: scale(0.90);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 800;
            background: rgba(0, 240, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
        }
        .status-badge.meltdown {
            background: rgba(255, 0, 85, 0.15);
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 0 20px var(--danger-glow);
            animation: blink 0.8s infinite alternate;
        }
        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        .btn-repair {
            display: none;
            width: 90%;
            padding: 14px;
            background: var(--danger);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 900;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 0 0 30px var(--danger-glow);
            text-transform: uppercase;
            transition: all 0.2s;
            max-width: 280px;
        }
        .btn-repair:hover {
            transform: scale(1.02);
            box-shadow: 0 0 45px var(--danger);
        }

        .click-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
        }

        /* ----- UPGRADES PANEL ----- */
        .upgrades-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .upgrades-list::-webkit-scrollbar {
            width: 4px;
        }
        .upgrades-list::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.25);
            border-radius: 3px;
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.2s;
        }
        .upgrade-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 240, 255, 0.2);
        }

        .upg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .upg-title {
            font-weight: 700;
            font-size: 0.82rem;
            color: #fff;
        }
        .upg-count {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--text-muted);
            font-weight: 700;
        }
        .upg-desc {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.3;
        }
        .upg-benefit {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--primary);
            background: rgba(0, 240, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            align-self: flex-start;
        }
        .btn-buy {
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid var(--border-color);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            margin-top: 4px;
        }
        .btn-buy:hover:not(:disabled) {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }
        .btn-buy:disabled {
            border-color: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            background: transparent;
        }

        .btn-reset {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .btn-reset:hover { color: var(--danger); }

        /* ============================================================
               RESPONSIVE BREAKPOINTS
               ============================================================ */

        /* --- Tablets & small laptops (≤ 1100px) --- */
        @media (max-width: 1100px) {
            .app-container {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: auto auto;
                gap: 14px;
                padding: 14px;
                height: calc(100vh - 65px);
                overflow-y: auto;
            }
            .center-panel {
                grid-column: 1 / -1;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 16px 12px;
            }
            .reactor-wrapper {
                width: 200px;
                height: 200px;
            }
            .reactor-core-btn {
                width: 125px;
                height: 125px;
            }
            .center-panel .status-badge {
                order: -1;
                width: 100%;
                text-align: center;
            }
            .center-panel .click-hint {
                width: 100%;
                text-align: center;
            }
            .btn-repair {
                width: 80%;
                max-width: 240px;
            }
        }

        /* --- Phones (≤ 700px) --- */
        @media (max-width: 700px) {
            body {
                overflow-y: auto;
                height: 100%;
                min-height: 100vh;
            }

            .navbar {
                height: 56px;
                padding: 0 10px;
                gap: 4px;
                flex-wrap: nowrap;
            }
            .btn-back {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
            .nav-title {
                font-size: 0.7rem;
                letter-spacing: 1px;
                white-space: nowrap;
            }
            .lang-select {
                font-size: 0.65rem;
                padding: 4px 8px;
                max-width: 90px;
            }

            .app-container {
                display: flex;
                flex-direction: column;
                height: auto;
                padding: 10px;
                gap: 12px;
                overflow: visible;
            }

            .panel {
                max-height: none;
                min-height: auto;
                flex: 0 0 auto;
                width: 100%;
            }

            /* Diagnostics panel */
            .diag-content {
                padding: 12px;
                gap: 8px;
            }
            .stat-card {
                padding: 10px 12px;
            }
            .stat-value {
                font-size: 1.1rem;
            }

            /* Center panel */
            .center-panel {
                padding: 14px 10px;
                gap: 10px;
                flex-direction: column;
                align-items: center;
            }
            .reactor-wrapper {
                width: 170px;
                height: 170px;
            }
            .reactor-core-btn {
                width: 105px;
                height: 105px;
            }
            .status-badge {
                font-size: 0.65rem;
                padding: 4px 12px;
                white-space: normal;
            }
            .btn-repair {
                width: 100%;
                font-size: 0.8rem;
                padding: 12px;
                max-width: 100%;
            }
            .click-hint {
                font-size: 0.65rem;
            }

            /* Upgrades panel */
            .panel-header {
                font-size: 0.7rem;
                padding: 10px 12px;
            }
            .upgrades-list {
                padding: 8px;
                gap: 8px;
                max-height: 340px;
            }
            .upgrade-card {
                padding: 8px 10px;
            }
            .upg-title {
                font-size: 0.75rem;
            }
            .btn-buy {
                font-size: 0.68rem;
                padding: 5px 8px;
            }

            .btn-reset {
                font-size: 0.65rem;
            }
        }

        /* --- Very small phones (≤ 400px) --- */
        @media (max-width: 400px) {
            .navbar {
                height: 50px;
                padding: 0 6px;
            }
            .btn-back {
                font-size: 0.55rem;
                padding: 3px 8px;
                gap: 4px;
            }
            .nav-title {
                font-size: 0.6rem;
                letter-spacing: 0.5px;
            }
            .lang-select {
                font-size: 0.55rem;
                padding: 3px 6px;
                max-width: 70px;
            }

            .reactor-wrapper {
                width: 140px;
                height: 140px;
            }
            .reactor-core-btn {
                width: 85px;
                height: 85px;
            }
            .stat-value {
                font-size: 0.95rem;
            }
            .upgrades-list {
                max-height: 260px;
            }
        }
    </style>
</head>

        <div class="panel">

            <div class="reactor-wrapper" id="reactorClickArea">

        <!-- Upgrades Marketplace -->

            </div>
            <div class="upgrades-list" id="upgradesList"></div>

    <script>
        /* ---------------------------------------------------
           1. CANVAS BACKGROUND ANIMATION
        --------------------------------------------------- */
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gridOffset = 0;

        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(0, 240, 255, 0.04)';
            ctx.lineWidth = 1;

            const size = 50;
            gridOffset = (gridOffset + 0.3) % size;

            for (let x = 0; x < canvas.width; x += size) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = gridOffset; y < canvas.height; y += size) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            requestAnimationFrame(drawGrid);
        }
        drawGrid();

        function loadState() {
            const saved = localStorage.getItem('cybercore_save_v5');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.lang = parsed.lang || 'en';
                    state.energy = parsed.energy || 0;
                    state.temp = parsed.temp || 25.0;
                    state.isMeltdown = parsed.isMeltdown || false;
                    if (parsed.upgrades) {
                        for (let key in parsed.upgrades) {
                            if (state.upgrades[key]) state.upgrades[key] = parsed.upgrades[key];
                        }
                    }
                } catch (e) {}
            }
            document.getElementById('langSelect').value = state.lang;
        }

        function saveState() {
            localStorage.setItem('cybercore_save_v5', JSON.stringify(state));
        }

        function changeLanguage(langKey) {
            state.lang = langKey;
            updateLanguageUI();
            updateUI();
            saveState();

        function resetProgress() {
            const t = TRANSLATIONS[state.lang] || TRANSLATIONS.en;
            if (confirm(t.resetConfirm)) {
                localStorage.removeItem('cybercore_save_v5');
                location.reload();
            }
        }

        function getCalculatedStats() {
            let eps = 0;
            let netHeat = 0;
            let maxTempBonus = 0;
            let clickPower = 1;
            let autoClicks = 0;

            UPGRADES_CONFIG.forEach(u => {
                let count = state.upgrades[u.id].count;
                eps += u.eps * count;
                netHeat += u.heat * count;
                maxTempBonus += u.cap * count;
                clickPower += u.click * count;
                autoClicks += u.autoClick * count;
            });

            let totalMaxTemp = state.baseMaxTemp + maxTempBonus;
            return { eps, netHeat, totalMaxTemp, clickPower, autoClicks };
        }

        function getUpgradeBenefitString(u) {
            let parts = [];
            if (u.eps > 0) parts.push(`+${formatNum(u.eps)} EV/s`);
            if (u.click > 0) parts.push(`+${formatNum(u.click)} Click Power`);
            if (u.autoClick > 0) parts.push(`+${u.autoClick} Auto-Clicks/s`);
            if (u.cap > 0) parts.push(`+${formatNum(u.cap)} °C Limit`);
            if (u.heat !== 0) {
                let sign = u.heat > 0 ? '+' : '';
                parts.push(`${sign}${u.heat.toFixed(1)} °C/s`);
            }
            return parts.join(' | ');
        }

            if (state.isMeltdown) return;
            const config = UPGRADES_CONFIG.find(u => u.id === id);
            const upgState = state.upgrades[id];

            if (state.energy >= upgState.currentCost) {
                state.energy -= upgState.currentCost;
                upgState.count++;
                upgState.currentCost = Math.floor(config.cost * Math.pow(1.22, upgState.count));
                updateUI();
                saveState();
            }
        }

            repairBtn.style.display = 'none';
            updateUI();
            saveState();

        /* MAIN TICK LOOP */
        setInterval(() => {
            if (state.isMeltdown) return;

            const stats = getCalculatedStats();
            state.energy += stats.eps + (stats.autoClicks * stats.clickPower);

            state.temp += stats.netHeat;
            if (state.temp < 25.0) state.temp = 25.0;

            if (state.temp >= stats.totalMaxTemp) {
                state.temp = stats.totalMaxTemp;
                triggerMeltdown();
            }

            updateUI();
            saveState();
        }, 1000);

        function formatNum(num) {
            if (num >= 1e12) return (num / 1e12).toFixed(2) + 'T';
            if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
            if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
            return Math.floor(num).toLocaleString();
        }

        function updateUI() {
            const stats = getCalculatedStats();

            document.getElementById('valEnergy').innerText = formatNum(state.energy) + ' EV';
            document.getElementById('valEPS').innerText = formatNum(stats.eps + (stats.autoClicks * stats.clickPower)) + ' EV/s';
            document.getElementById('valTemp').innerText = state.temp.toFixed(1) + ' °C';
            document.getElementById('valMaxTemp').innerText = formatNum(stats.totalMaxTemp) + ' °C';
            document.getElementById('clickPowerVal').innerText = formatNum(stats.clickPower);

            const heatBalEl = document.getElementById('valHeatBalance');
            heatBalEl.innerText = (stats.netHeat >= 0 ? '+' : '') + stats.netHeat.toFixed(1) + ' °C/s';
            heatBalEl.style.color = stats.netHeat > 0 ? 'var(--danger)' : (stats.netHeat < 0 ? 'var(--primary)' : '#fff');

            let pct = (state.temp / stats.totalMaxTemp) * 100;
            document.getElementById('barTemp').style.width = Math.min(100, Math.max(0, pct)) + '%';

            renderStore();
        }

                    UPGRADES_TEXT[u.id][state.lang] :
                    ((UPGRADES_TEXT[u.id] && UPGRADES_TEXT[u.id].en) ? UPGRADES_TEXT[u.id].en : { name: u.id, desc: "" });

                const benefitText = getUpgradeBenefitString(u);

                const card = document.createElement('div');
                card.className = 'upgrade-card';
                const canAfford = state.energy >= upgState.currentCost && !state.isMeltdown;

                card.innerHTML = `
                    <div class="upg-header">
                        <span class="upg-title">${upgData.name}</span>
                        <span class="upg-count">x${upgState.count}</span>
                    </div>
                    <div class="upg-desc">${upgData.desc}</div>
                    <div class="upg-benefit">⚡ ${t.gives} ${benefitText}</div>
                    <button class="btn-buy" ${!canAfford ? 'disabled' : ''} onclick="buyUpgrade('${u.id}')">
                        <span>${t.buy}</span>
                        <span>${formatNum(upgState.currentCost)} EV</span>
                    </button>
                `;
                container.appendChild(card);
            });

            document.getElementById('shopCount').innerText = `${purchasedCount} / ${UPGRADES_CONFIG.length}`;
        }

        loadState();
        updateLanguageUI();

        if (state.isMeltdown) {
            triggerMeltdown();
        } else {
            updateUI();
        }
    </script>

</body>
</html>
