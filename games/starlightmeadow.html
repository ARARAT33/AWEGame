<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Աստղային Մարգագետին | Starlight Meadow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0e16;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Segoe UI', 'Noto Sans Armenian', system-ui, -apple-system, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      box-shadow: 0 0 80px rgba(160, 120, 255, 0.45);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .ui-overlay > * {
      pointer-events: auto;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(16, 12, 26, 0.6);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 2px solid rgba(255, 210, 140, 0.7);
      border-radius: 60px;
      padding: 10px 26px;
      color: #f5ead5;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 32px rgba(255, 170, 50, 0.6), 0 0 70px rgba(255, 130, 20, 0.35);
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
      animation: floatBtn 5s ease-in-out infinite;
      z-index: 15;
    }
    .back-btn:hover {
      background: rgba(40, 26, 50, 0.82);
      border-color: #ffe68a;
      box-shadow: 0 0 58px #ffb347, 0 0 100px #ff7a20;
      transform: translateY(-4px) scale(1.05);
      color: #ffffff;
    }
    .back-btn:active { transform: scale(0.93); }
    .back-btn .star-icon {
      font-size: 22px;
      animation: spinStar 3.5s linear infinite;
      filter: drop-shadow(0 0 12px gold);
    }
    @keyframes spinStar {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.35); }
      100% { transform: rotate(360deg) scale(1); }
    }
    @keyframes floatBtn {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .score-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 12, 26, 0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 215, 140, 0.65);
      border-radius: 50px;
      padding: 12px 32px;
      color: #ffefc8;
      font-weight: 700;
      font-size: 19px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 34px rgba(255, 165, 35, 0.6);
      letter-spacing: 0.7px;
      z-index: 15;
    }
    .score-panel .star-badge {
      font-size: 26px;
      animation: pulseBadge 1.7s infinite;
    }
    @keyframes pulseBadge {
      0%,100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    .shop-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(28, 18, 38, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 195, 90, 0.75);
      border-radius: 50px;
      padding: 10px 24px;
      color: #ffd480;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 26px rgba(255, 175, 40, 0.55);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      z-index: 15;
    }
    .shop-btn:hover {
      background: rgba(50, 30, 55, 0.85);
      box-shadow: 0 0 50px #ffb347;
      transform: scale(1.07);
      color: #fff;
    }

    .shop-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(12, 8, 22, 0.92);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 2px solid rgba(255, 195, 90, 0.85);
      border-radius: 32px;
      padding: 32px 30px;
      color: #f2e0c0;
      text-align: center;
      min-width: 320px;
      box-shadow: 0 0 80px rgba(255, 150, 20, 0.65);
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 20px;
    }
    .shop-modal h2 {
      font-size: 28px;
      color: #ffd58c;
      text-shadow: 0 0 24px #ff8800;
      margin-bottom: 4px;
    }
    .shop-item {
      background: rgba(38, 22, 48, 0.75);
      border-radius: 24px;
      padding: 20px;
      border: 2px solid rgba(255, 195, 90, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .shop-item button {
      background: #c88a3c;
      border: none;
      border-radius: 40px;
      padding: 14px 28px;
      font-weight: bold;
      font-size: 17px;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 24px #f90;
      transition: 0.25s;
      letter-spacing: 0.4px;
    }
    .shop-item button:hover { background: #e09e4a; box-shadow: 0 0 40px #fa0; transform: scale(1.03); }
    .close-shop {
      background: rgba(200,100,100,0.5);
      border: 2px solid #ffaaaa;
      border-radius: 40px;
      padding: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.25s;
    }
    .close-shop:hover { background: rgba(220,90,90,0.7); }

    .lang-selector {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      background: rgba(16, 12, 26, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 2px solid rgba(255, 205, 120, 0.55);
      border-radius: 50px;
      padding: 12px 20px;
      box-shadow: 0 0 30px rgba(255, 155, 35, 0.45);
      z-index: 15;
    }
    .lang-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid rgba(255, 210, 130, 0.65);
      background: rgba(28, 20, 36, 0.7);
      color: #e0d0b0;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(255, 145, 35, 0.35);
    }
    .lang-btn.active {
      background: #c88a3c;
      border-color: #ffd58c;
      color: #fff;
      box-shadow: 0 0 36px #f90;
      transform: translateY(-3px);
    }
    .lang-btn:hover { background: rgba(70, 45, 55, 0.8); }

    .golden-indicator {
      position: absolute;
      top: 92px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,215,0,0.22);
      backdrop-filter: blur(12px);
      border: 2px solid gold;
      border-radius: 30px;
      padding: 7px 20px;
      color: #ffd700;
      font-weight: bold;
      font-size: 16px;
      display: none;
      animation: goldenPulse 1.3s infinite;
      z-index: 15;
    }
    @keyframes goldenPulse {
      0%,100% { box-shadow: 0 0 20px gold; }
      50% { box-shadow: 0 0 42px orange; }
    }

    @media (max-width: 650px) {
      .back-btn { padding: 8px 14px; font-size: 14px; top: 12px; left: 8px; }
      .score-panel { padding: 8px 18px; font-size: 15px; top: 12px; }
      .shop-btn { padding: 8px 14px; font-size: 14px; top: 12px; right: 8px; }
      .lang-btn { width: 34px; height: 34px; font-size: 12px; }
    }
  </style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div class="ui-overlay">
    <a class="back-btn" href="../index.html" id="backButton">
      <span class="star-icon">✦</span> <span id="backLabel">Տուն</span>
    </a>
    <div class="score-panel" id="scorePanel">
      <span class="star-badge">⭐</span> <span id="scoreText">Աստղեր: 0</span>
    </div>
    <button class="shop-btn" id="shopButton">🛒 <span id="shopLabel">Խանութ</span></button>
    <div class="golden-indicator" id="goldenIndicator">✨ Ոսկե աստղ! ✨</div>
    <div class="lang-selector" id="langContainer"></div>

    <div class="shop-modal" id="shopModal">
      <h2>✨ <span id="shopTitle">Խանութ</span> ✨</h2>
      <div class="shop-item">
        <div><strong>⚡ <span id="upgradeName">Հզոր հավաքիչ</span></strong></div>
        <div><span id="upgradeDesc">1.5x արագություն, 14.5x աստղեր</span></div>
        <div>💰 <span id="upgradeCost">Գին: 30 աստղ</span></div>
        <button id="buyUpgradeBtn">✨ <span id="buyBtnText">Գնել</span></button>
      </div>
      <button class="close-shop" id="closeShopBtn">❌ <span id="closeText">Փակել</span></button>
    </div>
  </div>
</div>

<script>
  (() => {
    // ────────────── Թարգմանություններ (10 լեզու) ──────────────
    const translations = {
      en: { 
        title: "Starlight Meadow", score: "Stars", home: "Home", shop: "Shop", 
        upgradeName: "Power Collector", upgradeDesc: "1.5x speed, 14.5x stars", 
        cost: "Cost", buy: "Buy", close: "Close", golden: "✨ Golden Star! ✨",
        speed: "Speed", multiplier: "Multiplier", level: "Level"
      },
      hy: { 
        title: "Աստղային Մարգագետին", score: "Աստղեր", home: "Տուն", shop: "Խանութ", 
        upgradeName: "Հզոր հավաքիչ", upgradeDesc: "1.5x արագություն, 14.5x աստղեր", 
        cost: "Գին", buy: "Գնել", close: "Փակել", golden: "✨ Ոսկե աստղ! ✨",
        speed: "Արագություն", multiplier: "Բազմապատկիչ", level: "Մակարդակ"
      },
      ru: { 
        title: "Звёздный Луг", score: "Звёзды", home: "Домой", shop: "Магазин", 
        upgradeName: "Мощный сборщик", upgradeDesc: "1.5x скорость, 14.5x звёзд", 
        cost: "Цена", buy: "Купить", close: "Закрыть", golden: "✨ Золотая звезда! ✨",
        speed: "Скорость", multiplier: "Множитель", level: "Уровень"
      },
      fr: { 
        title: "Prairie Étoilée", score: "Étoiles", home: "Accueil", shop: "Boutique", 
        upgradeName: "Collecteur puissant", upgradeDesc: "1.5x vitesse, 14.5x étoiles", 
        cost: "Prix", buy: "Acheter", close: "Fermer", golden: "✨ Étoile dorée! ✨",
        speed: "Vitesse", multiplier: "Multiplicateur", level: "Niveau"
      },
      es: { 
        title: "Pradera Estrellada", score: "Estrellas", home: "Inicio", shop: "Tienda", 
        upgradeName: "Colector poderoso", upgradeDesc: "1.5x velocidad, 14.5x estrellas", 
        cost: "Precio", buy: "Comprar", close: "Cerrar", golden: "✨ ¡Estrella dorada! ✨",
        speed: "Velocidad", multiplier: "Multiplicador", level: "Nivel"
      },
      de: { 
        title: "Sternenwiese", score: "Sterne", home: "Start", shop: "Laden", 
        upgradeName: "Starker Sammler", upgradeDesc: "1.5x Geschw., 14.5x Sterne", 
        cost: "Preis", buy: "Kaufen", close: "Schließen", golden: "✨ Goldener Stern! ✨",
        speed: "Geschw.", multiplier: "Multiplikator", level: "Stufe"
      },
      it: { 
        title: "Prato Stellato", score: "Stelle", home: "Casa", shop: "Negozio", 
        upgradeName: "Collezionista potente", upgradeDesc: "1.5x velocità, 14.5x stelle", 
        cost: "Prezzo", buy: "Compra", close: "Chiudi", golden: "✨ Stella dorata! ✨",
        speed: "Velocità", multiplier: "Moltiplicatore", level: "Livello"
      },
      ja: { 
        title: "星の草原", score: "星", home: "ホーム", shop: "ショップ", 
        upgradeName: "パワーコレクター", upgradeDesc: "1.5x 速度, 14.5x 星", 
        cost: "価格", buy: "購入", close: "閉じる", golden: "✨ 黄金の星! ✨",
        speed: "速度", multiplier: "倍率", level: "レベル"
      },
      zh: { 
        title: "星光草原", score: "星星", home: "首页", shop: "商店", 
        upgradeName: "强力收集器", upgradeDesc: "1.5x 速度, 14.5x 星星", 
        cost: "价格", buy: "购买", close: "关闭", golden: "✨ 黄金之星! ✨",
        speed: "速度", multiplier: "倍率", level: "等级"
      },
      ko: { 
        title: "별빛 초원", score: "별", home: "홈", shop: "상점", 
        upgradeName: "강력 수집가", upgradeDesc: "1.5x 속도, 14.5x 별", 
        cost: "가격", buy: "구매", close: "닫기", golden: "✨ 황금 별! ✨",
        speed: "속도", multiplier: "배율", level: "레벨"
      }
    };

    const langCodes = ['en','hy','ru','fr','es','de','it','ja','zh','ko'];
    const langDisplay = { en:'EN', hy:'Հայ', ru:'RU', fr:'FR', es:'ES', de:'DE', it:'IT', ja:'日', zh:'中', ko:'한' };

    // ────────────── localStorage օգնականներ ──────────────
    const lsGet = (key, fallback) => {
      try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
      catch { return fallback; }
    };
    const lsSet = (key, value) => {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    };

    // ────────────── Խաղի վիճակ ──────────────
    let currentLang = lsGet('starlight_lang', 'hy');
    if (!langCodes.includes(currentLang)) currentLang = 'hy';
    
    let score = lsGet('starlight_score', 0);
    let highScore = lsGet('starlight_high', 0);
    let totalCollected = lsGet('starlight_total', 0);
    let upgradeLevel = lsGet('starlight_upgradeLevel', 0);
    let upgradeCost = lsGet('starlight_upgradeCost', 30);

    // Օգտագործողի բոլոր տվյալների պահպանում
    function saveAllData() {
      lsSet('starlight_lang', currentLang);
      lsSet('starlight_score', score);
      lsSet('starlight_high', highScore);
      lsSet('starlight_total', totalCollected);
      lsSet('starlight_upgradeLevel', upgradeLevel);
      lsSet('starlight_upgradeCost', upgradeCost);
    }

    // Ամեն անգամ երբ տվյալ է փոխվում, պահպանում ենք
    function autoSave() {
      saveAllData();
    }

    const t = (key) => (translations[currentLang] && translations[currentLang][key]) || translations['en'][key] || key;

    // ────────────── DOM տարրեր ──────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const backLabel = document.getElementById('backLabel');
    const scoreText = document.getElementById('scoreText');
    const shopLabel = document.getElementById('shopLabel');
    const shopTitle = document.getElementById('shopTitle');
    const upgradeName = document.getElementById('upgradeName');
    const upgradeDesc = document.getElementById('upgradeDesc');
    const upgradeCostEl = document.getElementById('upgradeCost');
    const buyBtnText = document.getElementById('buyBtnText');
    const closeText = document.getElementById('closeText');
    const goldenIndicator = document.getElementById('goldenIndicator');
    const langContainer = document.getElementById('langContainer');
    const shopModal = document.getElementById('shopModal');
    const shopButton = document.getElementById('shopButton');
    const buyUpgradeBtn = document.getElementById('buyUpgradeBtn');
    const closeShopBtn = document.getElementById('closeShopBtn');

    let W, H;
    const WORLD_W = 3500, WORLD_H = 2500;
    let camX = 0, camY = 0, targetCamX = 0, targetCamY = 0;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);

    const player = {
      x: WORLD_W/2, y: WORLD_H/2, r: 22,
      baseSpeed: 250,
      get speed() { return this.baseSpeed * (1 + upgradeLevel * 0.5); },
      vx:0, vy:0, angle:0, bob:0,
      trail: []
    };

    const MAX_NORMAL_STARS = 55;
    let stars = [];
    let goldenStars = [];
    let particles = [];
    let goldenParticles = [];

    function createStar(golden = false) {
      return {
        x: 100+Math.random()*(WORLD_W-200),
        y: 100+Math.random()*(WORLD_H-200),
        r: golden ? 19+Math.random()*15 : 9+Math.random()*10,
        glowPh: Math.random()*Math.PI*2,
        glowSp: 0.8+Math.random()*2.5,
        floatPh: Math.random()*Math.PI*2,
        floatSp: 0.4+Math.random()*1.4,
        floatAmp: golden ? 9+Math.random()*17 : 5+Math.random()*12,
        sparkTimer: Math.random()*5,
        golden: golden,
        pulse: 0
      };
    }

    function initStars() {
      stars = Array.from({length: MAX_NORMAL_STARS}, () => createStar(false));
      goldenStars = [];
    }

    function spawnGoldenStar() {
      if (goldenStars.length < 3) {
        goldenStars.push(createStar(true));
        goldenIndicator.style.display = 'block';
        goldenIndicator.textContent = t('golden');
        setTimeout(() => { if(goldenStars.length===0) goldenIndicator.style.display = 'none'; }, 2800);
      }
    }

    function collectStar(star) {
      const multiplier = 1 + upgradeLevel * 13.5;
      if (star.golden) {
        goldenStars = goldenStars.filter(s => s !== star);
        const points = Math.floor(5 * multiplier);
        score += points;
        totalCollected += points;
        for(let i=0;i<55;i++){
          const a = Math.random()*Math.PI*2;
          goldenParticles.push({ x:star.x, y:star.y, vx:Math.cos(a)*(160+Math.random()*320), vy:Math.sin(a)*(160+Math.random()*320), life:1, decay:1.5+Math.random()*2.5, size:3+Math.random()*9, color:'#ffd700' });
        }
        if (goldenStars.length === 0) goldenIndicator.style.display = 'none';
      } else {
        stars = stars.filter(s => s !== star);
        stars.push(createStar(false));
        const points = Math.floor(1 * multiplier);
        score += points;
        totalCollected += points;
        for(let i=0;i<22;i++){
          particles.push({ x:star.x, y:star.y, vx:Math.cos(Math.random()*Math.PI*2)*170, vy:Math.sin(Math.random()*Math.PI*2)*170, life:1, decay:1.8+Math.random()*2.8, size:2+Math.random()*6, color:'#ffe9a0' });
        }
        if (score % 10 === 0 && score > 0) spawnGoldenStar();
      }

      if (score > highScore) { highScore = score; }
      autoSave();
      updateAllUI();
    }

    function buyUpgrade() {
      if (score >= upgradeCost) {
        score -= upgradeCost;
        upgradeLevel++;
        upgradeCost = Math.floor(upgradeCost * 1.7);
        autoSave();
        updateAllUI();
        // Տեսողական էֆեկտ
        for(let i=0;i<40;i++){
          particles.push({ x:player.x, y:player.y, vx:(Math.random()-0.5)*420, vy:(Math.random()-0.5)*420, life:1, decay:1.5, size:4+Math.random()*7, color:'#ffaa00' });
        }
      }
    }

    // ────────────── UI թարմացում (ակնթարթային) ──────────────
    function updateAllUI() {
      // Գլխավոր տեքստեր
      backLabel.textContent = t('home');
      shopLabel.textContent = t('shop');
      document.title = t('title');
      
      // Սքոր
      scoreText.textContent = t('score') + ': ' + score;
      
      // Խանութ
      shopTitle.textContent = '✨ ' + t('shop') + ' ✨';
      upgradeName.textContent = t('upgradeName');
      
      if (upgradeLevel > 0) {
        upgradeDesc.textContent = `1.5x ${t('speed')}, 14.5x ${t('multiplier')} (${t('level')} ${upgradeLevel})`;
      } else {
        upgradeDesc.textContent = `1.5x ${t('speed')}, 14.5x ${t('multiplier')}`;
      }
      
      upgradeCostEl.textContent = '💰 ' + t('cost') + ': ' + upgradeCost + ' ' + t('score').toLowerCase();
      buyBtnText.textContent = t('buy');
      closeText.textContent = t('close');
      
      // Ոսկե աստղի ցուցիչ
      if (goldenStars.length > 0) {
        goldenIndicator.textContent = t('golden');
      }
      
      // Լեզվի կոճակներ
      renderLangButtons();
    }

    function renderLangButtons() {
      langContainer.innerHTML = '';
      langCodes.forEach(code => {
        const btn = document.createElement('button');
        btn.className = 'lang-btn' + (code === currentLang ? ' active' : '');
        btn.textContent = langDisplay[code];
        btn.title = translations[code].title;
        btn.addEventListener('click', () => {
          if (currentLang !== code) {
            currentLang = code;
            autoSave();
            updateAllUI();
            // Լեզուն փոխելիս ակնթարթորեն թարմացնում ենք ամեն ինչ
            updateAllUI();
          }
        });
        langContainer.appendChild(btn);
      });
    }

    // ────────────── Աշխարհի կառուցում ──────────────
    let trees=[], flowers=[], grass=[], ambients=[];
    function buildWorld() {
      trees=[]; for(let i=0;i<80;i++) trees.push({ x:40+Math.random()*(WORLD_W-80), y:40+Math.random()*(WORLD_H-80), size:38+Math.random()*65, swayPh:Math.random()*Math.PI*2, swaySp:0.1+Math.random()*0.5, type:Math.floor(Math.random()*3) });
      flowers=[]; for(let i=0;i<300;i++) flowers.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H, size:3+Math.random()*10, color:['#f9d8e6','#ffe7b0','#ffd0d0','#e8d0ff','#fff0c8','#ffc8d8'][Math.floor(Math.random()*6)], swayPh:Math.random()*Math.PI*2, swaySp:0.5+Math.random()*1.7 });
      grass=[]; for(let i=0;i<450;i++) grass.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H, blades:3+Math.floor(Math.random()*9), h:11+Math.random()*28, swayPh:Math.random()*Math.PI*2, swaySp:0.5+Math.random()*2, color:['#7ab868','#6da85a','#82c070','#90cc78'][Math.floor(Math.random()*4)] });
      ambients=[]; for(let i=0;i<130;i++) ambients.push({ x:Math.random()*WORLD_W, y:Math.random()*WORLD_H, size:1+Math.random()*3.8, vx:-12+Math.random()*26, vy:-18+Math.random()*18, life:Math.random()*12, maxLife:7+Math.random()*20, glow:Math.random()<0.55 });
    }

    // ────────────── Կառավարում ──────────────
    const keys = {};
    window.addEventListener('keydown', e => { 
      keys[e.key.toLowerCase()] = true; 
      if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(e.key.toLowerCase())) e.preventDefault(); 
    });
    window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    
    let touchTarget = null;
    canvas.addEventListener('click', e => { touchTarget = { x: camX + e.clientX, y: camY + e.clientY }; });
    canvas.addEventListener('touchstart', e => { 
      if(e.touches.length) { 
        touchTarget = { x: camX + e.touches[0].clientX, y: camY + e.touches[0].clientY }; 
        e.preventDefault(); 
      } 
    }, { passive: false });

    shopButton.addEventListener('click', () => { 
      updateAllUI();
      shopModal.style.display = 'flex'; 
    });
    closeShopBtn.addEventListener('click', () => { shopModal.style.display = 'none'; });
    buyUpgradeBtn.addEventListener('click', buyUpgrade);

    // ────────────── Խաղի ցիկլ ──────────────
    let lastTime = performance.now(), gameTime = 0;
    function update(dt) {
      const cap = Math.min(dt, 0.15);
      gameTime += cap;
      
      let ix = 0, iy = 0;
      if(keys['arrowleft'] || keys['a']) ix -= 1;
      if(keys['arrowright'] || keys['d']) ix += 1;
      if(keys['arrowup'] || keys['w']) iy -= 1;
      if(keys['arrowdown'] || keys['s']) iy += 1;
      
      if(touchTarget) {
        const dx = touchTarget.x - player.x, dy = touchTarget.y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist < 8) touchTarget = null;
        else { 
          const n = 1/dist; 
          ix = dx * n; 
          iy = dy * n; 
          if(dist < 35) { const f = dist/35; ix *= f; iy *= f; }
        }
      }
      
      const mag = Math.sqrt(ix*ix + iy*iy);
      if(mag > 1) { ix /= mag; iy /= mag; }
      
      const sp = player.speed * cap;
      player.vx = ix * sp;
      player.vy = iy * sp;
      player.x += player.vx;
      player.y += player.vy;
      
      if(mag > 0.05) player.angle = Math.atan2(iy, ix);
      player.bob = mag > 0.05 ? player.bob + cap * 9 : player.bob * 0.9;
      
      player.x = Math.max(player.r, Math.min(WORLD_W - player.r, player.x));
      player.y = Math.max(player.r, Math.min(WORLD_H - player.r, player.y));
      
      if(mag > 0.1) player.trail.push({ x: player.x, y: player.y, life: 0.6 });
      player.trail.forEach(t => t.life -= cap * 2.8);
      player.trail = player.trail.filter(t => t.life > 0);
      
      targetCamX = player.x - W/2;
      targetCamY = player.y - H/2;
      targetCamX = Math.max(0, Math.min(targetCamX, WORLD_W - W));
      targetCamY = Math.max(0, Math.min(targetCamY, WORLD_H - H));
      camX += (targetCamX - camX) * Math.min(8.5 * cap, 1);
      camY += (targetCamY - camY) * Math.min(8.5 * cap, 1);
      
      [...stars, ...goldenStars].forEach(s => { 
        s.glowPh += s.glowSp * cap; 
        s.sparkTimer += cap; 
        if(s.golden) s.pulse += cap * 4.8; 
      });
      
      const allStars = [...stars, ...goldenStars];
      for(let i = allStars.length - 1; i >= 0; i--) {
        const s = allStars[i];
        const dx = player.x - s.x, dy = player.y - s.y;
        if(Math.sqrt(dx*dx + dy*dy) < player.r + s.r + 14) collectStar(s);
      }
      
      particles.forEach(p => { p.x += p.vx * cap; p.y += p.vy * cap; p.life -= p.decay * cap; });
      particles = particles.filter(p => p.life > 0);
      goldenParticles.forEach(p => { p.x += p.vx * cap; p.y += p.vy * cap; p.life -= p.decay * cap; });
      goldenParticles = goldenParticles.filter(p => p.life > 0);
      
      ambients.forEach(a => { 
        a.x += a.vx * cap; 
        a.y += a.vy * cap; 
        a.life += cap; 
        if(a.life > a.maxLife) { 
          a.life = 0; 
          a.x = Math.random() * WORLD_W; 
          a.y = Math.random() * WORLD_H; 
        } 
      });
      
      trees.forEach(t => t.swayPh += t.swaySp * cap);
      flowers.forEach(f => f.swayPh += f.swaySp * cap);
      grass.forEach(g => g.swayPh += g.swaySp * cap);
    }

    // ────────────── Նկարչություն ──────────────
    function drawSky() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#9abfe0');
      grad.addColorStop(0.5, '#e4eff9');
      grad.addColorStop(0.8, '#faf3e0');
      grad.addColorStop(1, '#ebcea4');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }
    
    function drawWorld() {
      ctx.fillStyle = '#aec8ae';
      ctx.beginPath();
      ctx.moveTo(0, H);
      for(let x = -40; x <= W + 40; x += 35) {
        ctx.lineTo(x, H * 0.52 - (65 + Math.sin((x + camX * 0.22) * 0.004) * 48));
      }
      ctx.lineTo(W, H);
      ctx.fill();
      
      const gy = H * 0.56;
      const gGrad = ctx.createLinearGradient(0, gy, 0, H);
      gGrad.addColorStop(0, '#c8dca8');
      gGrad.addColorStop(0.6, '#9ab674');
      gGrad.addColorStop(1, '#6a8c42');
      ctx.fillStyle = gGrad;
      ctx.fillRect(0, gy, W, H - gy);
    }
    
    function drawGrass() {
      grass.forEach(g => {
        if(g.x < camX - 35 || g.x > camX + W + 35 || g.y < camY - 35 || g.y > camY + H + 35) return;
        const sx = g.x - camX, sy = g.y - camY, sw = Math.sin(g.swayPh) * 3.8;
        ctx.strokeStyle = g.color;
        ctx.lineWidth = 1.3;
        for(let b = 0; b < g.blades; b++) {
          ctx.beginPath();
          ctx.moveTo(sx + (b - g.blades/2) * 4.8, sy);
          ctx.quadraticCurveTo(sx + sw + (b - g.blades/2) * 2.5, sy - g.h * 0.5, sx + sw * 1.7, sy - g.h);
          ctx.stroke();
        }
      });
    }
    
    function drawFlowers() {
      flowers.forEach(f => {
        if(f.x < camX - 25 || f.x > camX + W + 25 || f.y < camY - 25 || f.y > camY + H + 25) return;
        const sx = f.x - camX, sy = f.y - camY, sw = Math.sin(f.swayPh) * 3.2;
        ctx.strokeStyle = '#7aaa60';
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + sw, sy - f.size * 2.6);
        ctx.stroke();
        
        const px = sx + sw, py = sy - f.size * 2.6;
        ctx.fillStyle = f.color;
        for(let p = 0; p < 5; p++) {
          const a = (p/5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(px + Math.cos(a) * f.size * 0.78, py + Math.sin(a) * f.size * 0.78, f.size * 0.47, 0, Math.PI*2);
          ctx.fill();
        }
        ctx.fillStyle = '#fff8c0';
        ctx.beginPath();
        ctx.arc(px, py, f.size * 0.33, 0, Math.PI*2);
        ctx.fill();
      });
    }
    
    function drawTrees() {
      trees.filter(t => t.x > camX - 110 && t.x < camX + W + 110 && t.y > camY - 110 && t.y < camY + H + 110)
        .sort((a,b) => a.y - b.y)
        .forEach(t => {
          const sx = t.x - camX, sy = t.y - camY, sw = Math.sin(t.swayPh) * t.size * 0.09;
          ctx.fillStyle = '#c4a882';
          ctx.fillRect(sx - t.size*0.15, sy - t.size*0.3, t.size*0.3, t.size*1.3);
          
          if(t.type === 0) {
            ctx.fillStyle = '#8cc870';
            ctx.beginPath();
            ctx.arc(sx + sw, sy - t.size*0.6, t.size*0.78, 0, Math.PI*2);
            ctx.fill();
          } else if(t.type === 1) {
            ctx.fillStyle = '#6aad50';
            ctx.beginPath();
            ctx.moveTo(sx + sw, sy - t.size*1.35);
            ctx.lineTo(sx + sw + t.size*0.68, sy);
            ctx.lineTo(sx + sw - t.size*0.68, sy);
            ctx.fill();
          } else {
            for(let b = 0; b < 5; b++) {
              ctx.fillStyle = '#8cc870';
              ctx.beginPath();
              ctx.arc(sx + sw + (b-2)*t.size*0.35, sy - t.size*0.5 + Math.abs(b-2)*t.size*0.2, t.size*0.37, 0, Math.PI*2);
              ctx.fill();
            }
          }
        });
    }
    
    function drawStars() {
      [...stars, ...goldenStars].forEach(s => {
        if(s.x < camX - 65 || s.x > camX + W + 65 || s.y < camY - 65 || s.y > camY + H + 65) return;
        const sx = s.x - camX, sy = s.y - camY + Math.sin(s.floatPh + gameTime * s.floatSp) * s.floatAmp;
        
        if(s.golden) {
          const pulse = 1 + 0.3 * Math.sin(s.pulse);
          const g = ctx.createRadialGradient(sx, sy, s.r*0.1, sx, sy, s.r*3.8*pulse);
          g.addColorStop(0, 'rgba(255,215,0,1)');
          g.addColorStop(0.3, 'rgba(255,200,0,0.88)');
          g.addColorStop(0.7, 'rgba(255,140,0,0.38)');
          g.addColorStop(1, 'rgba(255,100,0,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(sx, sy, s.r*3.8*pulse, 0, Math.PI*2);
          ctx.fill();
          
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(sx, sy, s.r*0.98, 0, Math.PI*2);
          ctx.fill();
          
          ctx.fillStyle = '#fff9d0';
          ctx.beginPath();
          ctx.arc(sx - 2, sy - 2, s.r*0.42, 0, Math.PI*2);
          ctx.fill();
        } else {
          const g = ctx.createRadialGradient(sx, sy, s.r*0.2, sx, sy, s.r*3);
          g.addColorStop(0, 'rgba(255,230,130,0.92)');
          g.addColorStop(0.5, 'rgba(255,200,80,0.48)');
          g.addColorStop(1, 'rgba(255,150,30,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(sx, sy, s.r*3, 0, Math.PI*2);
          ctx.fill();
          
          ctx.fillStyle = '#fffbe0';
          ctx.beginPath();
          ctx.arc(sx, sy, s.r*0.92, 0, Math.PI*2);
          ctx.fill();
        }
      });
    }
    
    function drawPlayer() {
      const sx = player.x - camX, sy = player.y - camY + Math.sin(player.bob) * 3.8;
      
      player.trail.forEach(t => {
        ctx.fillStyle = `rgba(255,220,160,${t.life*0.55})`;
        ctx.beginPath();
        ctx.arc(t.x - camX, t.y - camY, player.r*0.5*t.life, 0, Math.PI*2);
        ctx.fill();
      });
      
      ctx.fillStyle = '#fae8d0';
      ctx.beginPath();
      ctx.arc(sx, sy, player.r, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#c8a078';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sx - 6, sy - 5, 5.8, 0, Math.PI*2);
      ctx.fill();
      ctx.arc(sx + 6, sy - 5, 5.8, 0, Math.PI*2);
      ctx.fill();
      
      ctx.fillStyle = '#2a1e0c';
      ctx.beginPath();
      ctx.arc(sx - 5, sy - 6, 2.9, 0, Math.PI*2);
      ctx.fill();
      ctx.arc(sx + 7, sy - 6, 2.9, 0, Math.PI*2);
      ctx.fill();
      
      // Փայլ
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sx - 7, sy - 7, 1.8, 0, Math.PI*2);
      ctx.fill();
      ctx.arc(sx + 5, sy - 7, 1.8, 0, Math.PI*2);
      ctx.fill();
    }
    
    function render() {
      ctx.clearRect(0, 0, W, H);
      drawSky();
      drawWorld();
      drawGrass();
      drawFlowers();
      drawTrees();
      drawStars();
      
      particles.forEach(p => {
        ctx.fillStyle = `rgba(255,220,100,${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      
      goldenParticles.forEach(p => {
        ctx.fillStyle = `rgba(255,215,0,${p.life})`;
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, p.size, 0, Math.PI*2);
        ctx.fill();
      });
      
      drawPlayer();
    }
    
    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(gameLoop);
    }
    
    // ────────────── Սկիզբ ──────────────
    resize();
    initStars();
    buildWorld();
    updateAllUI();
    
    // Ապահովում ենք, որ բոլոր տվյալները պահպանված լինեն
    autoSave();
    
    // Back button-ի համար
    document.getElementById('backButton').addEventListener('click', () => {
      autoSave();
      document.body.style.opacity = '0.6';
    });
    
    // Երբ օգտատերը դուրս է գալիս էջից, պահպանում ենք
    window.addEventListener('beforeunload', () => {
      autoSave();
    });
    
    // Պարբերաբար պահպանում ենք (ամեն 10 վայրկյանը մեկ)
    setInterval(autoSave, 10000);
    
    requestAnimationFrame(gameLoop);
  })();
</script>
</body>
