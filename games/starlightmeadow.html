<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starlight Meadow</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #gameCanvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 12px; color: #fff; font-size: clamp(12px, 2vw, 16px); }
        #backBtn { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: clamp(10px, 1.5vw, 14px); font-weight: bold; text-decoration: none; display: inline-block; }
        #startScreen, #gameOverScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); color: #fff; z-index: 50; }
        .hidden { display: none !important; }
        h1 { font-size: clamp(24px, 5vw, 48px); margin-bottom: 20px; text-shadow: 0 0 20px #e94560; }
        p { font-size: clamp(12px, 2vw, 18px); margin-bottom: 30px; text-align: center; padding: 0 20px; }
        button { background: linear-gradient(135deg, #e94560, #ff6b6b); border: none; color: #fff; padding: 15px 40px; font-size: clamp(14px, 2.5vw, 20px); font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 20px rgba(233,69,96,0.4); transition: transform 0.2s; }
        button:active { transform: scale(0.95); }
        #scoreDisplay, #highScoreDisplay { font-weight: bold; }
        #controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; padding: 0 20px; }
        .ctrl-btn { width: clamp(60px, 15vw, 80px); height: clamp(60px, 15vw, 80px); border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: clamp(20px, 5vw, 32px); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        @media (min-width: 768px) { #controls { display: none; } }
    </style>
</head>
<body>
    <a href="../index.html" id="backBtn">← BACK</a>
    <canvas id="gameCanvas"></canvas>
    <div id="ui" class="hidden">
        <span>Score: <span id="scoreDisplay">0</span></span>
        <span>High: <span id="highScoreDisplay">0</span></span>
    </div>
    <div id="startScreen">
        <h1>🌟 Starlight Meadow</h1>
        <p>Collect the glowing stars before they fade away!</p>
        <button id="startBtn">START GAME</button>
    </div>
    <div id="gameOverScreen" class="hidden">
        <h1>Game Over</h1>
        <p>Your Score: <span id="finalScore">0</span></p>
        <button id="restartBtn">PLAY AGAIN</button>
    </div>
    <div id="controls" class="hidden">
        <button class="ctrl-btn" id="leftBtn">◀</button>
        <button class="ctrl-btn" id="rightBtn">▶</button>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player, star, score, highScore, gameRunning, animationId;
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();
        
        // Load user data
        highScore = parseInt(localStorage.getItem('starlight_highscore')) || 0;
        document.getElementById('highScoreDisplay').textContent = highScore;
        
        function initGame() {
            player = { x: canvas.width / 2, y: canvas.height - 100, width: 50, height: 50, speed: 8 };
            spawnStar();
            score = 0;
            gameRunning = true;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('ui').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            gameLoop();
        }
        
        function spawnStar() {
            star = {
                x: Math.random() * (canvas.width - 40) + 20,
                y: -40,
                size: Math.random() * 20 + 20,
                speed: Math.random() * 3 + 2,
                hue: Math.random() * 360
            };
        }
        
        function update() {
            if (!gameRunning) return;
            star.y += star.speed;
            if (star.y > canvas.height) {
                gameOver();
                return;
            }
            if (player.x < star.x + star.size/2 && player.x + player.width > star.x - star.size/2 &&
                player.y < star.y + star.size/2 && player.y + player.height > star.y - star.size/2) {
                score += 10;
                document.getElementById('scoreDisplay').textContent = score;
                spawnStar();
            }
        }
        
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw player
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2, 0, Math.PI * 2);
            ctx.fill();
            // Draw star
            ctx.fillStyle = `hsl(${star.hue}, 100%, 60%)`;
            ctx.shadowColor = `hsl(${star.hue}, 100%, 60%)`;
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            animationId = requestAnimationFrame(gameLoop);
        }
        
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('starlight_highscore', highScore);
                document.getElementById('highScoreDisplay').textContent = highScore;
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('ui').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
        }
        
        // Controls
        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
        
        document.getElementById('leftBtn').addEventListener('touchstart', () => keys['ArrowLeft'] = true);
        document.getElementById('leftBtn').addEventListener('touchend', () => keys['ArrowLeft'] = false);
        document.getElementById('rightBtn').addEventListener('touchstart', () => keys['ArrowRight'] = true);
        document.getElementById('rightBtn').addEventListener('touchend', () => keys['ArrowRight'] = false);
        
        function handleInput() {
            if (keys['ArrowLeft'] || keys['a']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d']) player.x += player.speed;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        }
        
        setInterval(handleInput, 16);
        
        document.getElementById('startBtn').addEventListener('click', initGame);
        document.getElementById('restartBtn').addEventListener('click', initGame);
    </script>
</body>
</html>
