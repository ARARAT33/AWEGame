<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Hacker - Terminal Interface</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(10, 10, 10, 0.95);
            padding: 10px 15px;
            border-bottom: 2px solid #00ff00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        .back-btn {
            background: #00ff00;
            border: none;
            color: #0a0a0a;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 255, 0, 0.1);
            padding: 5px 10px;
            border: 1px solid #00ff00;
            border-radius: 3px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .terminal {
            flex: 1;
            background: #000;
            border: 2px solid #00ff00;
            border-radius: 3px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .terminal-output {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
        }
        .terminal-line {
            color: #00ff00;
            margin: 2px 0;
        }
        .terminal-line.error {
            color: #ff0000;
        }
        .terminal-line.success {
            color: #00ff00;
        }
        .terminal-line.warning {
            color: #ffff00;
        }
        .terminal-input-area {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .terminal-prompt {
            color: #00ff00;
            font-weight: bold;
        }
        .terminal-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            outline: none;
        }
        .sidebar {
            width: 200px;
            background: rgba(10, 10, 10, 0.95);
            border: 2px solid #00ff00;
            border-radius: 3px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #00ff00;
            font-size: 13px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }
        .command {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #00ff00;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .command:hover {
            background: rgba(0, 255, 0, 0.15);
            transform: translateX(3px);
        }
        .command-name { color: #00ff00; font-weight: bold; }
        .command-desc { color: #aabbff; font-size: 10px; }
        .lang-select {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>> CYBER TERMINAL</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">ACCESS: <span id="access">0</span></div>
            <div class="stat">DATA: <span id="data">0</span></div>
            <div class="stat">LEVEL: <span id="level">1</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="terminal">
            <div class="terminal-output" id="terminalOutput"></div>
            <div class="terminal-input-area">
                <span class="terminal-prompt">$</span>
                <input type="text" class="terminal-input" id="commandInput" placeholder="Enter command..." onkeypress="handleCommand(event)">
            </div>
        </div>
        
        <div class="sidebar">
            <h3 id="commandsTitle">COMMANDS</h3>
            <div id="commandsList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { commandsTitle: 'COMMANDS' },
            hy: { commandsTitle: 'ՀՐԱՄԱՆՆԵՐ' },
            ru: { commandsTitle: 'КОМАНДЫ' },
            fr: { commandsTitle: 'COMMANDES' },
            de: { commandsTitle: 'BEFEHLE' },
            es: { commandsTitle: 'COMANDOS' },
            ja: { commandsTitle: 'コマンド' },
            zh: { commandsTitle: '命令' },
            ar: { commandsTitle: 'الأوامر' },
            pt: { commandsTitle: 'COMANDOS' }
        };

        let gameState = {
            access: 0,
            data: 0,
            level: 1,
            output: [],
            language: 'en'
        };

        const commands = [
            { name: 'scan', desc: 'Scan network', action: () => scanNetwork() },
            { name: 'hack', desc: 'Breach system', action: () => hackSystem() },
            { name: 'extract', desc: 'Extract data', action: () => extractData() },
            { name: 'upgrade', desc: 'Upgrade tools', action: () => upgradeTools() },
            { name: 'clear', desc: 'Clear screen', action: () => clearScreen() }
        ];

        function addOutput(text, type = 'normal') {
            gameState.output.push({ text, type });
            if (gameState.output.length > 20) gameState.output.shift();
            renderOutput();
        }

        function renderOutput() {
            const output = document.getElementById('terminalOutput');
            output.innerHTML = '';
            gameState.output.forEach(line => {
                const div = document.createElement('div');
                div.className = `terminal-line ${line.type}`;
                div.textContent = line.text;
                output.appendChild(div);
            });
            output.scrollTop = output.scrollHeight;
        }

        function handleCommand(event) {
            if (event.key !== 'Enter') return;
            const input = document.getElementById('commandInput');
            const cmd = input.value.trim().toLowerCase();
            input.value = '';

            addOutput(`$ ${cmd}`, 'normal');

            const command = commands.find(c => c.name === cmd);
            if (command) {
                command.action();
            } else {
                addOutput(`Command not found: ${cmd}`, 'error');
            }
        }

        function scanNetwork() {
            addOutput('Scanning network...', 'warning');
            setTimeout(() => {
                gameState.access += 10;
                addOutput('Network scan complete. Access +10', 'success');
                updateUI();
                saveGame();
            }, 500);
        }

        function hackSystem() {
            if (gameState.access < 20) {
                addOutput('Insufficient access level!', 'error');
                return;
            }
            addOutput('Attempting breach...', 'warning');
            setTimeout(() => {
                gameState.access += 5;
                gameState.level++;
                addOutput('System breached! Level +1', 'success');
                updateUI();
                saveGame();
            }, 800);
        }

        function extractData() {
            if (gameState.level < 2) {
                addOutput('Insufficient level!', 'error');
                return;
            }
            addOutput('Extracting data...', 'warning');
            setTimeout(() => {
                gameState.data += 50;
                addOutput('Data extracted: +50', 'success');
                updateUI();
                saveGame();
            }, 600);
        }

        function upgradeTools() {
            if (gameState.data < 100) {
                addOutput('Insufficient data!', 'error');
                return;
            }
            gameState.data -= 100;
            gameState.access += 20;
            addOutput('Tools upgraded! Access +20', 'success');
            updateUI();
            saveGame();
        }

        function clearScreen() {
            gameState.output = [];
            renderOutput();
        }

        function renderCommands() {
            const list = document.getElementById('commandsList');
            list.innerHTML = '';
            commands.forEach(cmd => {
                const div = document.createElement('div');
                div.className = 'command';
                div.innerHTML = `
                    <div class="command-name">> ${cmd.name}</div>
                    <div class="command-desc">${cmd.desc}</div>
                `;
                div.onclick = () => {
                    document.getElementById('commandInput').value = cmd.name;
                    document.getElementById('commandInput').focus();
                };
                list.appendChild(div);
            });
        }

        function updateUI() {
            document.getElementById('access').textContent = gameState.access;
            document.getElementById('data').textContent = gameState.data;
            document.getElementById('level').textContent = gameState.level;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('commandsTitle').textContent = languages[gameState.language].commandsTitle;
        }

        function saveGame() {
            localStorage.setItem('cyberHacker2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('cyberHacker2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            } else {
                addOutput('Welcome to Cyber Terminal v1.0', 'success');
                addOutput('Type "help" for commands', 'normal');
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('commandsTitle').textContent = languages[gameState.language].commandsTitle;
        renderOutput();
        renderCommands();
        updateUI();
        document.getElementById('commandInput').focus();
    </script>
</body>
</html>
