<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Farmer - Farming Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #1a3a0a 100%);
            color: #90ee90;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: rgba(45, 80, 22, 0.9);
            padding: 12px 20px;
            border-bottom: 2px solid #90ee90;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 24px;
            color: #90ee90;
            text-shadow: 0 0 10px #90ee90;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #90ee90, #66bb6a);
            border: none;
            color: #1a3a0a;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .back-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #90ee90;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(144, 238, 144, 0.1);
            padding: 8px 12px;
            border-radius: 4px;
            border-left: 3px solid #90ee90;
        }
        
        .container {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }
        
        .game-area {
            flex: 1;
            background: radial-gradient(circle at 50% 50%, rgba(144, 238, 144, 0.1), rgba(26, 58, 10, 0.9));
            border: 2px solid #90ee90;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .farm-plot {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b7355, #654321);
            border: 3px solid #90ee90;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .farm-plot:hover {
            transform: scale(1.05);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5), 0 0 15px #90ee90;
        }
        
        .farm-plot:active {
            transform: scale(0.95);
        }
        
        .crop {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        
        .sidebar {
            width: 280px;
            background: rgba(45, 80, 22, 0.9);
            border: 2px solid #90ee90;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .sidebar h3 {
            color: #90ee90;
            font-size: 16px;
            margin-bottom: 10px;
            border-bottom: 1px solid #90ee90;
            padding-bottom: 8px;
        }
        
        .upgrade {
            background: rgba(144, 238, 144, 0.1);
            border: 1px solid #90ee90;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .upgrade:hover {
            background: rgba(144, 238, 144, 0.2);
            transform: translateX(5px);
        }
        
        .upgrade.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .upgrade-name {
            color: #90ee90;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .upgrade-cost {
            color: #ffaa00;
            font-size: 11px;
        }
        
        .upgrade-desc {
            color: #aaffaa;
            font-size: 11px;
            margin-top: 4px;
        }
        
        .lang-select {
            background: rgba(144, 238, 144, 0.2);
            border: 1px solid #90ee90;
            color: #90ee90;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #90ee90;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌾 Pixel Farmer</h1>
        <button class="back-btn" onclick="goHome()">← Back</button>
        <div class="stats">
            <div class="stat-item">🌽 Crops: <span id="crops">0</span></div>
            <div class="stat-item">💰 Gold: <span id="gold">0</span></div>
            <div class="stat-item">🌱 Plots: <span id="plots">1</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="hy">Հայերեն</option>
            <option value="ru">Русский</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ja">日本語</option>
            <option value="zh">中文</option>
            <option value="ar">العربية</option>
            <option value="pt">Português</option>
        </select>
    </div>
    
    <div class="container">
        <div class="game-area">
            <canvas id="effectCanvas"></canvas>
            <div class="farm-plot" id="farmPlot" onclick="harvestCrop()">
                <div class="crop" id="cropDisplay">🌱</div>
            </div>
        </div>
        
        <div class="sidebar">
            <h3 id="upgradesTitle">Upgrades</h3>
            <div id="upgradesList"></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameState = {
            crops: 0,
            gold: 0,
            plots: 1,
            harvestSpeed: 1,
            cropsPerHarvest: 1,
            language: 'en'
        };
        
        let particles = [];
        let growthStage = 0;
        
        const languages = {
            en: {
                upgradesTitle: 'Upgrades',
                plot: 'New Plot',
                plotDesc: '+1 plot',
                harvest: 'Harvest Boost',
                harvestDesc: '+1 crop/harvest',
                speed: 'Growth Speed',
                speedDesc: '+0.5 speed',
                backBtn: 'Back'
            },
            hy: {
                upgradesTitle: 'Հարմարեցումներ',
                plot: 'Նոր Հողատարածք',
                plotDesc: '+1 հողատարածք',
                harvest: 'Հավաք Բուստ',
                harvestDesc: '+1 ցանց/հավաք',
                speed: 'Աճի Արագություն',
                speedDesc: '+0.5 արագություն',
                backBtn: 'Վերադառնալ'
            },
            ru: {
                upgradesTitle: 'Улучшения',
                plot: 'Новый участок',
                plotDesc: '+1 участок',
                harvest: 'Урожай Буст',
                harvestDesc: '+1 урожай/сбор',
                speed: 'Скорость роста',
                speedDesc: '+0.5 скорость',
                backBtn: 'Назад'
            },
            fr: {
                upgradesTitle: 'Améliorations',
                plot: 'Nouvelle parcelle',
                plotDesc: '+1 parcelle',
                harvest: 'Boost de récolte',
                harvestDesc: '+1 récolte/moisson',
                speed: 'Vitesse de croissance',
                speedDesc: '+0.5 vitesse',
                backBtn: 'Retour'
            },
            de: {
                upgradesTitle: 'Verbesserungen',
                plot: 'Neues Grundstück',
                plotDesc: '+1 Grundstück',
                harvest: 'Ernte-Boost',
                harvestDesc: '+1 Ernte/Ernte',
                speed: 'Wachstumsgeschwindigkeit',
                speedDesc: '+0.5 Geschwindigkeit',
                backBtn: 'Zurück'
            },
            es: {
                upgradesTitle: 'Mejoras',
                plot: 'Nueva parcela',
                plotDesc: '+1 parcela',
                harvest: 'Impulso de cosecha',
                harvestDesc: '+1 cosecha/cosecha',
                speed: 'Velocidad de crecimiento',
                speedDesc: '+0.5 velocidad',
                backBtn: 'Atrás'
            },
            ja: {
                upgradesTitle: 'アップグレード',
                plot: '新しいプロット',
                plotDesc: '+1プロット',
                harvest: '収穫ブースト',
                harvestDesc: '+1収穫/収穫',
                speed: '成長速度',
                speedDesc: '+0.5速度',
                backBtn: '戻る'
            },
            zh: {
                upgradesTitle: '升级',
                plot: '新地块',
                plotDesc: '+1地块',
                harvest: '收获增强',
                harvestDesc: '+1收获/收获',
                speed: '生长速度',
                speedDesc: '+0.5速度',
                backBtn: '返回'
            },
            ar: {
                upgradesTitle: 'الترقيات',
                plot: 'قطعة جديدة',
                plotDesc: '+1 قطعة',
                harvest: 'تعزيز الحصاد',
                harvestDesc: '+1 حصاد/حصاد',
                speed: 'سرعة النمو',
                speedDesc: '+0.5 سرعة',
                backBtn: 'عودة'
            },
            pt: {
                upgradesTitle: 'Melhorias',
                plot: 'Novo lote',
                plotDesc: '+1 lote',
                harvest: 'Impulso de colheita',
                harvestDesc: '+1 colheita/colheita',
                speed: 'Velocidade de crescimento',
                speedDesc: '+0.5 velocidade',
                backBtn: 'Voltar'
            }
        };
        
        const upgrades = [
            { id: 'plot', baseCost: 100, langKey: 'plot', descKey: 'plotDesc', effect: () => gameState.plots++ },
            { id: 'harvest', baseCost: 75, langKey: 'harvest', descKey: 'harvestDesc', effect: () => gameState.cropsPerHarvest++ },
            { id: 'speed', baseCost: 50, langKey: 'speed', descKey: 'speedDesc', effect: () => gameState.harvestSpeed += 0.5 }
        ];
        
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }
        
        function createParticles(x, y) {
            for (let i = 0; i < 20; i++) {
                const angle = (Math.PI * 2 * i) / 20;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 2,
                    vy: Math.sin(angle) * 2,
                    life: 60,
                    size: Math.random() * 3 + 1
                });
            }
        }
        
        function gameLoop() {
            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw soil texture
            ctx.fillStyle = 'rgba(144, 238, 144, 0.05)';
            for (let i = 0; i < 100; i++) {
                const x = (i * 47) % canvas.width;
                const y = (i * 71) % canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }
            
            // Draw particles
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                
                ctx.fillStyle = `rgba(144, 238, 144, ${p.life / 60})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Update growth stage
            growthStage += 0.01;
            const stages = ['🌱', '🌿', '🌾', '🌽'];
            const stage = Math.floor(growthStage % stages.length);
            document.getElementById('cropDisplay').textContent = stages[stage];
            
            // Update UI
            document.getElementById('crops').textContent = Math.floor(gameState.crops);
            document.getElementById('gold').textContent = Math.floor(gameState.gold);
            document.getElementById('plots').textContent = gameState.plots;
            
            requestAnimationFrame(gameLoop);
        }
        
        function harvestCrop() {
            gameState.crops += gameState.cropsPerHarvest * gameState.plots;
            gameState.gold += gameState.cropsPerHarvest * gameState.plots * 0.5;
            
            const plot = document.getElementById('farmPlot');
            const rect = plot.getBoundingClientRect();
            createParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);
        }
        
        function renderUpgrades() {
            const list = document.getElementById('upgradesList');
            list.innerHTML = '';
            
            upgrades.forEach(upgrade => {
                const cost = Math.ceil(upgrade.baseCost * Math.pow(1.15, upgrade.count || 0));
                const canAfford = gameState.gold >= cost;
                
                const div = document.createElement('div');
                div.className = `upgrade ${!canAfford ? 'disabled' : ''}`;
                div.innerHTML = `
                    <div class="upgrade-name">${languages[gameState.language][upgrade.langKey]}</div>
                    <div class="upgrade-desc">${languages[gameState.language][upgrade.descKey]}</div>
                    <div class="upgrade-cost">Cost: ${cost} 💰</div>
                `;
                
                if (canAfford) {
                    div.onclick = () => buyUpgrade(upgrade);
                }
                
                list.appendChild(div);
            });
        }
        
        function buyUpgrade(upgrade) {
            const cost = Math.ceil(upgrade.baseCost * Math.pow(1.15, upgrade.count || 0));
            if (gameState.gold >= cost) {
                gameState.gold -= cost;
                upgrade.count = (upgrade.count || 0) + 1;
                upgrade.effect();
                renderUpgrades();
            }
        }
        
        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('upgradesTitle').textContent = languages[gameState.language].upgradesTitle;
            renderUpgrades();
        }
        
        function goHome() {
            window.location.href = '../index.html';
        }
        
        // Save state
        setInterval(() => {
            localStorage.setItem('pixelFarmerState', JSON.stringify(gameState));
        }, 5000);
        
        // Load state
        const saved = localStorage.getItem('pixelFarmerState');
        if (saved) {
            Object.assign(gameState, JSON.parse(saved));
            document.getElementById('langSelect').value = gameState.language;
        }
        
        document.getElementById('upgradesTitle').textContent = languages[gameState.language].upgradesTitle;
        renderUpgrades();
        gameLoop();
    </script>
</body>
</html>
