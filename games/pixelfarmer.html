<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Farmer - Grid Farming</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #2d5016, #1a3a0a);
            color: #90ee90;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(45, 80, 22, 0.95);
            padding: 10px 15px;
            border-bottom: 2px solid #90ee90;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #90ee90; text-shadow: 0 0 10px #90ee90; }
        .back-btn {
            background: linear-gradient(135deg, #90ee90, #66bb6a);
            border: none;
            color: #1a3a0a;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(144, 238, 144, 0.1);
            padding: 5px 10px;
            border: 1px solid #90ee90;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .farm-grid {
            flex: 1;
            background: linear-gradient(135deg, #1a3a0a, #0d1f05);
            border: 2px solid #90ee90;
            border-radius: 5px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            overflow: auto;
            align-content: start;
        }
        .farm-cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #3d5a1f, #2a4015);
            border: 2px solid #90ee90;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            transition: all 0.2s;
            position: relative;
        }
        .farm-cell:hover {
            transform: scale(1.05);
            box-shadow: 0 0 10px #90ee90;
        }
        .farm-cell.planted {
            background: linear-gradient(135deg, #4a6b2f, #3d5a1f);
            border-color: #00ff00;
        }
        .farm-cell-level {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0, 0, 0, 0.5);
            color: #90ee90;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 3px;
        }
        .sidebar {
            width: 200px;
            background: rgba(45, 80, 22, 0.95);
            border: 2px solid #90ee90;
            border-radius: 5px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #90ee90;
            font-size: 13px;
            border-bottom: 1px solid #90ee90;
            padding-bottom: 5px;
        }
        .seed {
            background: rgba(144, 238, 144, 0.1);
            border: 1px solid #90ee90;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .seed:hover {
            background: rgba(144, 238, 144, 0.2);
            transform: translateX(3px);
        }
        .seed.active {
            background: rgba(144, 238, 144, 0.3);
            border-color: #00ff00;
        }
        .seed-name { color: #90ee90; font-weight: bold; }
        .seed-time { color: #aabbff; font-size: 10px; }
        .lang-select {
            background: rgba(144, 238, 144, 0.2);
            border: 1px solid #90ee90;
            color: #90ee90;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: #90ee90; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌾 PIXEL FARM</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">CROPS: <span id="crops">0</span></div>
            <div class="stat">PLANTED: <span id="planted">0</span></div>
            <div class="stat">HARVEST: <span id="harvest">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="farm-grid" id="farmGrid"></div>
        
        <div class="sidebar">
            <h3 id="seedsTitle">SEEDS</h3>
            <div id="seedsList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { seedsTitle: 'SEEDS', wheat: 'Wheat', corn: 'Corn', carrot: 'Carrot' },
            hy: { seedsTitle: 'ՍԵՐՄԵՐ', wheat: 'Ցորեն', corn: 'Кукуруза', carrot: 'Գազար' },
            ru: { seedsTitle: 'СЕМЕНА', wheat: 'Пшеница', corn: 'Кукуруза', carrot: 'Морковь' },
            fr: { seedsTitle: 'GRAINES', wheat: 'Blé', corn: 'Maïs', carrot: 'Carotte' },
            de: { seedsTitle: 'SAMEN', wheat: 'Weizen', corn: 'Mais', carrot: 'Karotte' },
            es: { seedsTitle: 'SEMILLAS', wheat: 'Trigo', corn: 'Maíz', carrot: 'Zanahoria' },
            ja: { seedsTitle: '種', wheat: '小麦', corn: 'トウモロコシ', carrot: 'ニンジン' },
            zh: { seedsTitle: '种子', wheat: '小麦', corn: '玉米', carrot: '胡萝卜' },
            ar: { seedsTitle: 'البذور', wheat: 'قمح', corn: 'ذرة', carrot: 'جزر' },
            pt: { seedsTitle: 'SEMENTES', wheat: 'Trigo', corn: 'Milho', carrot: 'Cenoura' }
        };

        let gameState = {
            crops: 0,
            harvest: 0,
            selectedSeed: null,
            cells: Array(36).fill(null),
            language: 'en'
        };

        const seeds = [
            { type: 'wheat', icon: '🌾', growTime: 3, reward: 10 },
            { type: 'corn', icon: '🌽', growTime: 5, reward: 15 },
            { type: 'carrot', icon: '🥕', growTime: 4, reward: 12 }
        ];

        function renderFarm() {
            const grid = document.getElementById('farmGrid');
            grid.innerHTML = '';
            gameState.cells.forEach((cell, idx) => {
                const div = document.createElement('div');
                div.className = 'farm-cell';
                if (cell) div.classList.add('planted');
                
                if (cell) {
                    const seed = seeds.find(s => s.type === cell.type);
                    div.innerHTML = seed.icon;
                    if (cell.growth < seed.growTime) {
                        div.innerHTML += `<div class="farm-cell-level">${cell.growth}/${seed.growTime}</div>`;
                    } else {
                        div.innerHTML = '✓';
                    }
                }
                
                div.onclick = () => plantSeed(idx);
                grid.appendChild(div);
            });
        }

        function plantSeed(idx) {
            if (!gameState.selectedSeed) return;
            if (gameState.cells[idx]) return;
            
            gameState.cells[idx] = {
                type: gameState.selectedSeed.type,
                growth: 0,
                planted: Date.now()
            };
            gameState.crops++;
            renderFarm();
            updateUI();
            saveGame();
        }

        function renderSeeds() {
            const list = document.getElementById('seedsList');
            list.innerHTML = '';
            seeds.forEach(seed => {
                const div = document.createElement('div');
                div.className = 'seed';
                if (gameState.selectedSeed?.type === seed.type) div.classList.add('active');
                div.innerHTML = `
                    <div class="seed-name">${seed.icon} ${languages[gameState.language][seed.type]}</div>
                    <div class="seed-time">Growth: ${seed.growTime}s</div>
                `;
                div.onclick = () => {
                    gameState.selectedSeed = seed;
                    renderSeeds();
                };
                list.appendChild(div);
            });
        }

        function updateUI() {
            document.getElementById('crops').textContent = gameState.crops;
            document.getElementById('planted').textContent = gameState.cells.filter(c => c).length;
            document.getElementById('harvest').textContent = gameState.harvest;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('seedsTitle').textContent = languages[gameState.language].seedsTitle;
            renderSeeds();
        }

        function saveGame() {
            localStorage.setItem('pixelFarmer2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('pixelFarmer2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('seedsTitle').textContent = languages[gameState.language].seedsTitle;
        renderFarm();
        renderSeeds();
        updateUI();

        setInterval(() => {
            gameState.cells.forEach((cell, idx) => {
                if (cell && cell.growth < 10) {
                    cell.growth++;
                    const seed = seeds.find(s => s.type === cell.type);
                    if (cell.growth >= seed.growTime) {
                        gameState.harvest++;
                    }
                }
            });
            renderFarm();
            updateUI();
        }, 1000);
    </script>
</body>
</html>
