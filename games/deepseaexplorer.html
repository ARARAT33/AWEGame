<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Sea Explorer - Sonar Exploration</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #001a4d, #000033);
            color: #00ccff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(0, 26, 77, 0.95);
            padding: 10px 15px;
            border-bottom: 2px solid #00ccff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #00ccff; text-shadow: 0 0 10px #00ccff; }
        .back-btn {
            background: linear-gradient(135deg, #00ccff, #0099ff);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 204, 255, 0.1);
            padding: 5px 10px;
            border: 1px solid #00ccff;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .sonar-container {
            flex: 1;
            background: radial-gradient(circle at center, rgba(0, 204, 255, 0.1), rgba(0, 26, 77, 0.9));
            border: 2px solid #00ccff;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .sonar {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 204, 255, 0.2), rgba(0, 26, 77, 0.8));
            border: 3px solid #00ccff;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sonar::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(0, 204, 255, 0.3);
            top: 0;
            left: 0;
            animation: sonarPulse 2s infinite;
        }
        @keyframes sonarPulse {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .sonar-center {
            width: 20px;
            height: 20px;
            background: #00ccff;
            border-radius: 50%;
            z-index: 10;
        }
        .creature {
            position: absolute;
            width: 30px;
            height: 30px;
            background: rgba(0, 255, 150, 0.6);
            border-radius: 50%;
            border: 2px solid #00ff96;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .creature:hover {
            transform: scale(1.2);
            box-shadow: 0 0 15px #00ff96;
        }
        .sidebar {
            width: 200px;
            background: rgba(0, 26, 77, 0.95);
            border: 2px solid #00ccff;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #00ccff;
            font-size: 13px;
            border-bottom: 1px solid #00ccff;
            padding-bottom: 5px;
        }
        .creature-card {
            background: rgba(0, 204, 255, 0.1);
            border: 1px solid #00ccff;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .creature-card:hover {
            background: rgba(0, 204, 255, 0.2);
            transform: translateX(3px);
        }
        .creature-name { color: #00ff96; font-weight: bold; }
        .creature-depth { color: #aabbff; font-size: 10px; }
        .lang-select {
            background: rgba(0, 204, 255, 0.2);
            border: 1px solid #00ccff;
            color: #00ccff;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: #00ccff; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐠 SONAR EXPLORER</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">DEPTH: <span id="depth">0</span>m</div>
            <div class="stat">CREATURES: <span id="creatures">0</span></div>
            <div class="stat">SCANNED: <span id="scanned">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="sonar-container">
            <div class="sonar" id="sonar">
                <div class="sonar-center"></div>
            </div>
        </div>
        
        <div class="sidebar">
            <h3 id="creaturesTitle">CREATURES</h3>
            <div id="creaturesList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { creaturesTitle: 'CREATURES' },
            hy: { creaturesTitle: 'ԱՐԱՐԱԾՆԵՐ' },
            ru: { creaturesTitle: 'СУЩЕСТВА' },
            fr: { creaturesTitle: 'CRÉATURES' },
            de: { creaturesTitle: 'KREATUREN' },
            es: { creaturesTitle: 'CRIATURAS' },
            ja: { creaturesTitle: 'クリーチャー' },
            zh: { creaturesTitle: '生物' },
            ar: { creaturesTitle: 'المخلوقات' },
            pt: { creaturesTitle: 'CRIATURAS' }
        };

        let gameState = {
            depth: 0,
            creatures: [],
            scanned: [],
            language: 'en'
        };

        const creatureTypes = [
            { name: 'Anglerfish', icon: '🐟', depth: 1000 },
            { name: 'Jellyfish', icon: '🪼', depth: 500 },
            { name: 'Octopus', icon: '🐙', depth: 800 },
            { name: 'Seahorse', icon: '🐴', depth: 300 },
            { name: 'Starfish', icon: '⭐', depth: 600 }
        ];

        function spawnCreature() {
            const type = creatureTypes[Math.floor(Math.random() * creatureTypes.length)];
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 120 + 40;
            
            gameState.creatures.push({
                id: Date.now(),
                type: type.name,
                icon: type.icon,
                x: 150 + Math.cos(angle) * distance,
                y: 150 + Math.sin(angle) * distance,
                scanned: false
            });
            
            renderSonar();
        }

        function renderSonar() {
            const sonar = document.getElementById('sonar');
            const existing = sonar.querySelectorAll('.creature');
            existing.forEach(el => el.remove());
            
            gameState.creatures.forEach(creature => {
                const div = document.createElement('div');
                div.className = 'creature';
                div.innerHTML = creature.icon;
                div.style.left = creature.x + 'px';
                div.style.top = creature.y + 'px';
                div.style.transform = 'translate(-50%, -50%)';
                if (creature.scanned) {
                    div.style.background = 'rgba(0, 255, 150, 0.9)';
                    div.style.boxShadow = '0 0 15px #00ff96';
                }
                div.onclick = () => scanCreature(creature);
                sonar.appendChild(div);
            });
        }

        function scanCreature(creature) {
            if (!creature.scanned) {
                creature.scanned = true;
                gameState.scanned.push(creature.type);
                renderSonar();
                renderCreatures();
                updateUI();
                saveGame();
            }
        }

        function renderCreatures() {
            const list = document.getElementById('creaturesList');
            list.innerHTML = '';
            gameState.creatures.forEach(creature => {
                const div = document.createElement('div');
                div.className = 'creature-card';
                div.style.opacity = creature.scanned ? '1' : '0.5';
                div.innerHTML = `
                    <div class="creature-name">${creature.icon} ${creature.type}</div>
                    <div class="creature-depth">${creature.scanned ? '✓ Scanned' : 'Click to scan'}</div>
                `;
                div.onclick = () => scanCreature(creature);
                list.appendChild(div);
            });
        }

        function updateUI() {
            document.getElementById('depth').textContent = gameState.depth;
            document.getElementById('creatures').textContent = gameState.creatures.length;
            document.getElementById('scanned').textContent = gameState.scanned.length;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('creaturesTitle').textContent = languages[gameState.language].creaturesTitle;
        }

        function saveGame() {
            localStorage.setItem('deepSeaExplorer2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('deepSeaExplorer2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('creaturesTitle').textContent = languages[gameState.language].creaturesTitle;
        updateUI();
        renderCreatures();

        setInterval(() => {
            gameState.depth += 10;
            if (Math.random() < 0.3) {
                spawnCreature();
            }
            updateUI();
        }, 2000);
    </script>
</body>
</html>
