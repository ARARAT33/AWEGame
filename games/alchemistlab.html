<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alchemist's Lab - Potion Crafting</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #2d1b4e, #1a0f2e);
            color: #d4af37;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(45, 27, 78, 0.95);
            padding: 10px 15px;
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #d4af37; text-shadow: 0 0 10px #d4af37; }
        .back-btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: none;
            color: #1a0f2e;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(212, 175, 55, 0.1);
            padding: 5px 10px;
            border: 1px solid #d4af37;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .lab-area {
            flex: 1;
            background: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.1), rgba(26, 15, 46, 0.9));
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            overflow-y: auto;
        }
        .ingredient {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(100, 50, 150, 0.2));
            border: 2px dashed #d4af37;
            border-radius: 8px;
            padding: 12px;
            cursor: grab;
            transition: all 0.2s;
            text-align: center;
        }
        .ingredient:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #d4af37;
        }
        .ingredient:active {
            cursor: grabbing;
        }
        .ingredient-name { color: #d4af37; font-weight: bold; font-size: 13px; }
        .ingredient-qty { color: #aabbff; font-size: 11px; }
        .cauldron-zone {
            grid-column: 1 / -1;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15), rgba(26, 15, 46, 0.8));
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 150px;
            position: relative;
        }
        .cauldron {
            width: 100px;
            height: 100px;
            border: 3px solid #d4af37;
            border-radius: 0 0 50px 50px;
            background: radial-gradient(circle, #4a3f35, #2a2520);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 10px;
        }
        .potion-liquid {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            height: 40px;
            background: linear-gradient(180deg, #00ff00, #00aa00);
            border-radius: 0 0 30px 30px;
            opacity: 0.6;
        }
        .sidebar {
            width: 200px;
            background: rgba(45, 27, 78, 0.95);
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #d4af37;
            font-size: 13px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 5px;
        }
        .recipe {
            background: rgba(212, 175, 55, 0.1);
            border: 2px solid #d4af37;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .recipe:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateX(3px);
        }
        .recipe-name { color: #d4af37; font-weight: bold; }
        .recipe-effect { color: #aabbff; font-size: 10px; }
        .lang-select {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(212, 175, 55, 0.1); }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧪 ALCHEMIST'S WORKSHOP</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">POTIONS: <span id="potions">0</span></div>
            <div class="stat">ESSENCE: <span id="essence">0</span></div>
            <div class="stat">RECIPES: <span id="recipes">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="lab-area" id="labArea"></div>
        
        <div class="sidebar">
            <h3 id="recipesTitle">RECIPES</h3>
            <div id="recipesList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { recipesTitle: 'RECIPES', health: 'Health Potion', strength: 'Strength Elixir', mana: 'Mana Essence' },
            hy: { recipesTitle: 'ԲԱՂԱԴՐԱՏՈՄԵՐ', health: 'Առողջության Թուրմ', strength: 'Ուժի Էլիքսիր', mana: 'Մանայի Էսենցիա' },
            ru: { recipesTitle: 'РЕЦЕПТЫ', health: 'Зелье здоровья', strength: 'Эликсир силы', mana: 'Эссенция маны' },
            fr: { recipesTitle: 'RECETTES', health: 'Potion de santé', strength: 'Élixir de force', mana: 'Essence de mana' },
            de: { recipesTitle: 'REZEPTE', health: 'Heiltrank', strength: 'Stärkeelixier', mana: 'Mana-Essenz' },
            es: { recipesTitle: 'RECETAS', health: 'Poción de salud', strength: 'Elixir de fuerza', mana: 'Esencia de maná' },
            ja: { recipesTitle: 'レシピ', health: '健康ポーション', strength: '力のエリクサー', mana: 'マナエッセンス' },
            zh: { recipesTitle: '配方', health: '健康药水', strength: '力量灵药', mana: '魔力精华' },
            ar: { recipesTitle: 'الوصفات', health: 'جرعة الصحة', strength: 'إكسير القوة', mana: 'جوهر المانا' },
            pt: { recipesTitle: 'RECEITAS', health: 'Poção de saúde', strength: 'Elixir de força', mana: 'Essência de mana' }
        };

        let gameState = {
            potions: 0,
            essence: 0,
            recipes: 0,
            ingredients: { red: 10, blue: 8, green: 6, purple: 4 },
            language: 'en'
        };

        const recipes = [
            { name: 'health', requires: { red: 2, blue: 1 }, reward: 50 },
            { name: 'strength', requires: { purple: 3, red: 1 }, reward: 75 },
            { name: 'mana', requires: { blue: 2, green: 2 }, reward: 60 }
        ];

        function renderLab() {
            const area = document.getElementById('labArea');
            area.innerHTML = '';

            // Ingredients
            Object.entries(gameState.ingredients).forEach(([type, qty]) => {
                const div = document.createElement('div');
                div.className = 'ingredient';
                const colors = { red: '🔴', blue: '🔵', green: '🟢', purple: '🟣' };
                div.innerHTML = `
                    <div class="ingredient-name">${colors[type]} ${type.toUpperCase()}</div>
                    <div class="ingredient-qty">x${qty}</div>
                `;
                div.draggable = true;
                div.ondragstart = (e) => e.dataTransfer.setData('ingredient', type);
                area.appendChild(div);
            });

            // Cauldron
            const cauldron = document.createElement('div');
            cauldron.className = 'cauldron-zone';
            cauldron.innerHTML = '<div class="cauldron">🫖</div><div style="color: #d4af37; font-size: 12px;">Drag ingredients here</div>';
            cauldron.ondragover = (e) => e.preventDefault();
            cauldron.ondrop = (e) => {
                e.preventDefault();
                const ingredient = e.dataTransfer.getData('ingredient');
                if (gameState.ingredients[ingredient] > 0) {
                    gameState.ingredients[ingredient]--;
                    gameState.essence += 10;
                    renderLab();
                    updateUI();
                    saveGame();
                }
            };
            area.appendChild(cauldron);
        }

        function renderRecipes() {
            const list = document.getElementById('recipesList');
            list.innerHTML = '';
            recipes.forEach(recipe => {
                const div = document.createElement('div');
                div.className = 'recipe';
                const canMake = Object.entries(recipe.requires).every(([ing, qty]) => gameState.ingredients[ing] >= qty);
                div.style.opacity = canMake ? '1' : '0.5';
                div.innerHTML = `
                    <div class="recipe-name">${languages[gameState.language][recipe.name]}</div>
                    <div class="recipe-effect">Reward: ${recipe.reward} essence</div>
                `;
                if (canMake) {
                    div.onclick = () => craftPotion(recipe);
                }
                list.appendChild(div);
            });
        }

        function craftPotion(recipe) {
            const canMake = Object.entries(recipe.requires).every(([ing, qty]) => gameState.ingredients[ing] >= qty);
            if (canMake) {
                Object.entries(recipe.requires).forEach(([ing, qty]) => {
                    gameState.ingredients[ing] -= qty;
                });
                gameState.potions++;
                gameState.essence += recipe.reward;
                gameState.recipes++;
                renderLab();
                renderRecipes();
                updateUI();
                saveGame();
            }
        }

        function updateUI() {
            document.getElementById('potions').textContent = gameState.potions;
            document.getElementById('essence').textContent = gameState.essence;
            document.getElementById('recipes').textContent = gameState.recipes;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('recipesTitle').textContent = languages[gameState.language].recipesTitle;
            renderRecipes();
        }

        function saveGame() {
            localStorage.setItem('alchemistLab2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('alchemistLab2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('recipesTitle').textContent = languages[gameState.language].recipesTitle;
        renderLab();
        renderRecipes();
        updateUI();
    </script>
</body>
</html>
