<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Clicker - Rhythm Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Arial', sans-serif;
            background: radial-gradient(circle at center, #1a0033, #0a0015);
            color: #ff00ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(26, 0, 51, 0.95);
            padding: 10px 15px;
            border-bottom: 3px solid #ff00ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #ff00ff; text-shadow: 0 0 15px #ff00ff; }
        .back-btn {
            background: #ff00ff;
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 0, 255, 0.15);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid #ff00ff;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .game-area {
            flex: 1;
            background: radial-gradient(circle at center, rgba(255, 0, 255, 0.1), rgba(10, 0, 21, 0.9));
            border: 3px solid #ff00ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .rhythm-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff00ff, #00ffff, #ff00ff);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: spin 3s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .click-zone {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff0080, #ff00ff);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 60px;
            transition: all 0.1s;
            box-shadow: 0 0 30px #ff00ff;
        }
        .click-zone:active {
            transform: scale(0.9);
            box-shadow: 0 0 50px #ff00ff;
        }
        .sidebar {
            width: 200px;
            background: rgba(26, 0, 51, 0.95);
            border: 3px solid #ff00ff;
            border-radius: 15px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #00ffff;
            font-size: 13px;
            border-bottom: 2px solid #00ffff;
            padding-bottom: 5px;
        }
        .power-up {
            background: rgba(255, 0, 255, 0.15);
            border: 2px solid #ff00ff;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .power-up:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: translateX(3px);
        }
        .power-up.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .power-name { color: #00ffff; font-weight: bold; }
        .power-cost { color: #ffaa00; font-size: 10px; }
        .lang-select {
            background: rgba(255, 0, 255, 0.15);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 0, 255, 0.1); }
        ::-webkit-scrollbar-thumb { background: #ff00ff; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ RHYTHM CLICKER</h1>
        <button class="back-btn" onclick="goHome()">←</button>
        <div class="stats">
            <div class="stat">SCORE: <span id="score">0</span></div>
            <div class="stat">COMBO: <span id="combo">0</span>x</div>
            <div class="stat">BEAT: <span id="beat">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="game-area">
            <div class="rhythm-circle">
                <div class="click-zone" id="clickZone" onclick="click()">💥</div>
            </div>
        </div>
        
        <div class="sidebar">
            <h3 id="upgradesTitle">UPGRADES</h3>
            <div id="upgradesList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { upgradesTitle: 'UPGRADES', multiplier: 'Multiplier', multDesc: 'x2 score', rhythm: 'Rhythm', rhythmDesc: 'Better timing', beat: 'Beat Sync', beatDesc: '+50% combo' },
            hy: { upgradesTitle: 'ՀԱՐՄԱՐԵՑՈՒՄՆԵՐ', multiplier: 'Բազմապատկիչ', multDesc: 'x2 միավոր', rhythm: 'Ռիթմ', rhythmDesc: 'Ավելի լավ ժամանակ', beat: 'Բիթ Համաժամ', beatDesc: '+50% կոմբո' },
            ru: { upgradesTitle: 'УЛУЧШЕНИЯ', multiplier: 'Множитель', multDesc: 'x2 очки', rhythm: 'Ритм', rhythmDesc: 'Лучший тайминг', beat: 'Синхро', beatDesc: '+50% комбо' },
            fr: { upgradesTitle: 'AMÉLIORATIONS', multiplier: 'Multiplicateur', multDesc: 'x2 points', rhythm: 'Rythme', rhythmDesc: 'Meilleur timing', beat: 'Sync', beatDesc: '+50% combo' },
            de: { upgradesTitle: 'VERBESSERUNGEN', multiplier: 'Multiplikator', multDesc: 'x2 Punkte', rhythm: 'Rhythmus', rhythmDesc: 'Besseres Timing', beat: 'Sync', beatDesc: '+50% Combo' },
            es: { upgradesTitle: 'MEJORAS', multiplier: 'Multiplicador', multDesc: 'x2 puntos', rhythm: 'Ritmo', rhythmDesc: 'Mejor timing', beat: 'Sincronización', beatDesc: '+50% combo' },
            ja: { upgradesTitle: 'アップグレード', multiplier: 'マルチプライヤー', multDesc: 'x2スコア', rhythm: 'リズム', rhythmDesc: 'より良いタイミング', beat: 'ビート同期', beatDesc: '+50%コンボ' },
            zh: { upgradesTitle: '升级', multiplier: '倍数', multDesc: 'x2分数', rhythm: '节奏', rhythmDesc: '更好的时机', beat: '节拍同步', beatDesc: '+50%连击' },
            ar: { upgradesTitle: 'الترقيات', multiplier: 'مضاعف', multDesc: 'x2 نقطة', rhythm: 'إيقاع', rhythmDesc: 'توقيت أفضل', beat: 'مزامنة', beatDesc: '+50% كومبو' },
            pt: { upgradesTitle: 'MELHORIAS', multiplier: 'Multiplicador', multDesc: 'x2 pontos', rhythm: 'Ritmo', rhythmDesc: 'Melhor timing', beat: 'Sincronização', beatDesc: '+50% combo' }
        };

        let gameState = {
            score: 0,
            combo: 0,
            beat: 0,
            multiplier: 1,
            beatSync: 0,
            language: 'en'
        };

        const upgrades = [
            { id: 'multiplier', cost: 500, langKey: 'multiplier', descKey: 'multDesc', effect: () => gameState.multiplier *= 2 },
            { id: 'rhythm', cost: 300, langKey: 'rhythm', descKey: 'rhythmDesc', effect: () => {} },
            { id: 'beat', cost: 400, langKey: 'beat', descKey: 'beatDesc', effect: () => gameState.beatSync += 0.5 }
        ];

        function click() {
            gameState.beat++;
            gameState.combo++;
            gameState.score += (10 * gameState.multiplier * gameState.combo);
            updateUI();
            saveGame();
        }

        function renderUpgrades() {
            const list = document.getElementById('upgradesList');
            list.innerHTML = '';
            upgrades.forEach(up => {
                const cost = Math.ceil(up.cost * Math.pow(1.4, up.count || 0));
                const canAfford = gameState.score >= cost;
                const div = document.createElement('div');
                div.className = `power-up ${!canAfford ? 'disabled' : ''}`;
                div.innerHTML = `
                    <div class="power-name">${languages[gameState.language][up.langKey]}</div>
                    <div style="color: #aabbff; font-size: 10px;">${languages[gameState.language][up.descKey]}</div>
                    <div class="power-cost">Cost: ${cost}</div>
                `;
                if (canAfford) {
                    div.onclick = () => buyUpgrade(up);
                }
                list.appendChild(div);
            });
        }

        function buyUpgrade(up) {
            const cost = Math.ceil(up.cost * Math.pow(1.4, up.count || 0));
            if (gameState.score >= cost) {
                gameState.score -= cost;
                up.count = (up.count || 0) + 1;
                up.effect();
                renderUpgrades();
                updateUI();
                saveGame();
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('combo').textContent = gameState.combo;
            document.getElementById('beat').textContent = gameState.beat;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('upgradesTitle').textContent = languages[gameState.language].upgradesTitle;
            renderUpgrades();
        }

        function saveGame() {
            localStorage.setItem('neonClicker2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('neonClicker2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('upgradesTitle').textContent = languages[gameState.language].upgradesTitle;
        renderUpgrades();
        updateUI();

        setInterval(() => {
            if (gameState.combo > 0) gameState.combo -= 0.3;
            updateUI();
        }, 1000);
    </script>
</body>
</html>
