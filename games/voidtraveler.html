<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Void Traveler - Vector Navigation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0f0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(0, 0, 0, 0.95);
            padding: 10px 15px;
            border-bottom: 2px solid #0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #0f0; text-shadow: 0 0 10px #0f0; }
        .back-btn {
            background: #0f0;
            border: none;
            color: #000;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 255, 0, 0.1);
            padding: 5px 10px;
            border: 1px solid #0f0;
            border-radius: 3px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        canvas {
            flex: 1;
            background: #000;
            border: 2px solid #0f0;
            border-radius: 3px;
        }
        .sidebar {
            width: 220px;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #0f0;
            border-radius: 3px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #0f0;
            font-size: 13px;
            border-bottom: 1px solid #0f0;
            padding-bottom: 5px;
        }
        .waypoint {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0f0;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .waypoint:hover {
            background: rgba(0, 255, 0, 0.15);
            transform: translateX(3px);
        }
        .waypoint-name { color: #0f0; font-weight: bold; }
        .waypoint-dist { color: #ffaa00; font-size: 10px; }
        .lang-select {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #0f0;
            color: #0f0;
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.5); }
        ::-webkit-scrollbar-thumb { background: #0f0; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>> VOID NAVIGATOR</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">X: <span id="x">0</span></div>
            <div class="stat">Y: <span id="y">0</span></div>
            <div class="stat">FUEL: <span id="fuel">100</span>%</div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <canvas id="mapCanvas"></canvas>
        
        <div class="sidebar">
            <h3 id="waypointsTitle">WAYPOINTS</h3>
            <div id="waypointsList"></div>
        </div>
    </div>

    <script>
        const languages = {
            en: { waypointsTitle: 'WAYPOINTS', explore: 'Explore', exploreDesc: 'New location' },
            hy: { waypointsTitle: 'ՈՒՂԵԿԵՏՆԵՐ', explore: 'Հետազոտել', exploreDesc: 'Նոր տեղ' },
            ru: { waypointsTitle: 'ТОЧКИ МАРШРУТА', explore: 'Исследовать', exploreDesc: 'Новое место' },
            fr: { waypointsTitle: 'POINTS DE ROUTE', explore: 'Explorer', exploreDesc: 'Nouveau lieu' },
            de: { waypointsTitle: 'WEGPUNKTE', explore: 'Erkunden', exploreDesc: 'Neuer Ort' },
            es: { waypointsTitle: 'PUNTOS DE RUTA', explore: 'Explorar', exploreDesc: 'Nuevo lugar' },
            ja: { waypointsTitle: 'ウェイポイント', explore: '探索', exploreDesc: '新しい場所' },
            zh: { waypointsTitle: '航点', explore: '探索', exploreDesc: '新地点' },
            ar: { waypointsTitle: 'نقاط الطريق', explore: 'استكشاف', exploreDesc: 'موقع جديد' },
            pt: { waypointsTitle: 'PONTOS DE ROTA', explore: 'Explorar', exploreDesc: 'Novo local' }
        };

        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            x: 0,
            y: 0,
            fuel: 100,
            waypoints: [],
            visited: [],
            language: 'en'
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function initWaypoints() {
            gameState.waypoints = [];
            for (let i = 0; i < 8; i++) {
                gameState.waypoints.push({
                    id: i,
                    x: Math.random() * 1000 - 500,
                    y: Math.random() * 1000 - 500,
                    name: `SECTOR-${String.fromCharCode(65 + i)}`
                });
            }
        }

        function drawMap() {
            resizeCanvas();
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const scale = 0.5;

            // Draw waypoints
            gameState.waypoints.forEach(wp => {
                const px = centerX + wp.x * scale;
                const py = centerY + wp.y * scale;

                if (gameState.visited.includes(wp.id)) {
                    ctx.fillStyle = '#0f0';
                    ctx.fillRect(px - 5, py - 5, 10, 10);
                } else {
                    ctx.strokeStyle = '#0f0';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(px, py, 5, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });

            // Draw player
            ctx.fillStyle = '#0f0';
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - 8);
            ctx.lineTo(centerX - 6, centerY + 8);
            ctx.lineTo(centerX + 6, centerY + 8);
            ctx.closePath();
            ctx.fill();

            // Draw fuel indicator
            ctx.fillStyle = '#0f0';
            ctx.font = '12px Courier New';
            ctx.fillText(`FUEL: ${Math.floor(gameState.fuel)}%`, 10, 20);
        }

        function travelTo(waypoint) {
            if (gameState.fuel < 20) return;
            gameState.x = waypoint.x;
            gameState.y = waypoint.y;
            gameState.fuel -= 20;
            if (!gameState.visited.includes(waypoint.id)) {
                gameState.visited.push(waypoint.id);
            }
            gameState.fuel = Math.min(100, gameState.fuel + 5);
            updateUI();
            drawMap();
            saveGame();
        }

        function renderWaypoints() {
            const list = document.getElementById('waypointsList');
            list.innerHTML = '';
            gameState.waypoints.forEach(wp => {
                const div = document.createElement('div');
                div.className = 'waypoint';
                const dist = Math.sqrt(wp.x * wp.x + wp.y * wp.y).toFixed(0);
                div.innerHTML = `
                    <div class="waypoint-name">${wp.name}</div>
                    <div class="waypoint-dist">Distance: ${dist} ly</div>
                `;
                div.onclick = () => travelTo(wp);
                list.appendChild(div);
            });
        }

        function updateUI() {
            document.getElementById('x').textContent = gameState.x.toFixed(0);
            document.getElementById('y').textContent = gameState.y.toFixed(0);
            document.getElementById('fuel').textContent = Math.floor(gameState.fuel);
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('waypointsTitle').textContent = languages[gameState.language].waypointsTitle;
            renderWaypoints();
        }

        function saveGame() {
            localStorage.setItem('voidTraveler2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('voidTraveler2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            } else {
                initWaypoints();
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('waypointsTitle').textContent = languages[gameState.language].waypointsTitle;
        renderWaypoints();
        updateUI();
        drawMap();

        window.addEventListener('resize', drawMap);
    </script>
</body>
</html>
