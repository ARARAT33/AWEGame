<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ancient Empire - City Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #4a3728, #2d1f14);
            color: #d4af37;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(74, 55, 40, 0.95);
            padding: 10px 15px;
            border-bottom: 3px solid #d4af37;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #d4af37; text-shadow: 0 0 10px #d4af37; }
        .back-btn {
            background: linear-gradient(135deg, #d4af37, #aa8c2c);
            border: none;
            color: #2d1f14;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(212, 175, 55, 0.1);
            padding: 5px 10px;
            border: 1px solid #d4af37;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        canvas {
            flex: 1;
            background: linear-gradient(135deg, #2d1f14, #1a1108);
            border: 3px solid #d4af37;
            border-radius: 10px;
        }
        .sidebar {
            width: 220px;
            background: rgba(74, 55, 40, 0.95);
            border: 3px solid #d4af37;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #d4af37;
            font-size: 13px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 5px;
        }
        .building-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .building-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateX(3px);
        }
        .building-btn.active {
            background: rgba(212, 175, 55, 0.3);
            border-color: #ffff00;
        }
        .stats-panel {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            color: #aabbff;
        }
        .lang-select {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(212, 175, 55, 0.1); }
        ::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏛️ CITY BUILDER</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">BUILDINGS: <span id="buildings">1</span></div>
            <div class="stat">POPULATION: <span id="population">100</span></div>
            <div class="stat">POWER: <span id="power">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <canvas id="cityCanvas"></canvas>
        
        <div class="sidebar">
            <h3 id="buildingsTitle">BUILD</h3>
            <button class="building-btn" onclick="selectBuilding('house')">🏠 House</button>
            <button class="building-btn" onclick="selectBuilding('market')">🏪 Market</button>
            <button class="building-btn" onclick="selectBuilding('temple')">🏛️ Temple</button>
            <button class="building-btn" onclick="selectBuilding('farm')">🌾 Farm</button>
            <hr style="border: 1px solid #d4af37; margin: 10px 0;">
            <h3>INFO</h3>
            <div class="stats-panel">
                <div>Click on grid to build</div>
                <div style="margin-top: 5px;">Selected: <span id="selected">None</span></div>
            </div>
        </div>
    </div>

    <script>
        const languages = {
            en: { buildingsTitle: 'BUILD' },
            hy: { buildingsTitle: 'ԿԱՌՈՒՑԵԼ' },
            ru: { buildingsTitle: 'СТРОИТЬ' },
            fr: { buildingsTitle: 'CONSTRUIRE' },
            de: { buildingsTitle: 'BAUEN' },
            es: { buildingsTitle: 'CONSTRUIR' },
            ja: { buildingsTitle: '建築' },
            zh: { buildingsTitle: '建造' },
            ar: { buildingsTitle: 'بناء' },
            pt: { buildingsTitle: 'CONSTRUIR' }
        };

        const canvas = document.getElementById('cityCanvas');
        const ctx = canvas.getContext('2d');

        let gameState = {
            buildings: [],
            population: 100,
            power: 0,
            selectedBuilding: null,
            language: 'en',
            gridSize: 40
        };

        const buildingTypes = {
            house: { icon: '🏠', cost: 50, pop: 20, power: -5 },
            market: { icon: '🏪', cost: 100, pop: 10, power: -10 },
            temple: { icon: '🏛️', cost: 150, pop: 5, power: 20 },
            farm: { icon: '🌾', cost: 75, pop: 15, power: 10 }
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function drawGrid() {
            resizeCanvas();
            ctx.fillStyle = '#2d1f14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(212, 175, 55, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += gameState.gridSize) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += gameState.gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw buildings
            gameState.buildings.forEach(building => {
                const x = building.gridX * gameState.gridSize + gameState.gridSize / 2;
                const y = building.gridY * gameState.gridSize + gameState.gridSize / 2;
                
                ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
                ctx.fillRect(building.gridX * gameState.gridSize, building.gridY * gameState.gridSize, gameState.gridSize, gameState.gridSize);
                
                ctx.font = '24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(buildingTypes[building.type].icon, x, y);
            });
        }

        function selectBuilding(type) {
            gameState.selectedBuilding = type;
            document.querySelectorAll('.building-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('selected').textContent = type.toUpperCase();
        }

        function placeBuilding(gridX, gridY) {
            if (!gameState.selectedBuilding) return;
            if (gameState.buildings.some(b => b.gridX === gridX && b.gridY === gridY)) return;

            const type = gameState.selectedBuilding;
            const building = buildingTypes[type];

            gameState.buildings.push({ type, gridX, gridY });
            gameState.population += building.pop;
            gameState.power += building.power;

            drawGrid();
            updateUI();
            saveGame();
        }

        function updateUI() {
            document.getElementById('buildings').textContent = gameState.buildings.length;
            document.getElementById('population').textContent = gameState.population;
            document.getElementById('power').textContent = gameState.power;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('buildingsTitle').textContent = languages[gameState.language].buildingsTitle;
        }

        function saveGame() {
            localStorage.setItem('ancientEmpire2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('ancientEmpire2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const gridX = Math.floor(x / gameState.gridSize);
            const gridY = Math.floor(y / gameState.gridSize);
            placeBuilding(gridX, gridY);
        });

        loadGame();
        document.getElementById('buildingsTitle').textContent = languages[gameState.language].buildingsTitle;
        updateUI();
        drawGrid();

        window.addEventListener('resize', drawGrid);
    </script>
</body>
</html>
