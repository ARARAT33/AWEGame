<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Trader - Economic Simulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033, #330066);
            color: #ffaa00;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(26, 0, 51, 0.7);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            border-bottom: 2px solid #ffaa00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #ffaa00; text-shadow: 0 0 10px #ffaa00; }
        .back-btn {
            background: linear-gradient(135deg, #ffaa00, #ff8800);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(255, 170, 0, 0.1);
            backdrop-filter: blur(10px);
            padding: 5px 10px;
            border: 1px solid #ffaa00;
            border-radius: 8px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .market-area {
            flex: 1;
            background: rgba(26, 0, 51, 0.5);
            backdrop-filter: blur(10px);
            border: 2px solid #ffaa00;
            border-radius: 15px;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .commodity {
            background: rgba(255, 170, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid #ffaa00;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .commodity:hover {
            background: rgba(255, 170, 0, 0.2);
            transform: scale(1.05);
        }
        .commodity-name { color: #ffaa00; font-weight: bold; font-size: 13px; }
        .commodity-price { color: #00ff88; font-size: 12px; margin: 5px 0; }
        .commodity-chart {
            width: 100%;
            height: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }
        .chart-bar {
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ff8800);
            transition: width 0.3s;
        }
        .sidebar {
            width: 220px;
            background: rgba(26, 0, 51, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid #ffaa00;
            border-radius: 15px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #ffaa00;
            font-size: 13px;
            border-bottom: 1px solid #ffaa00;
            padding-bottom: 5px;
        }
        .trade-btn {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .trade-btn:hover {
            background: rgba(255, 170, 0, 0.4);
            transform: translateX(3px);
        }
        .portfolio {
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid #ffaa00;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            color: #aabbff;
        }
        .lang-select {
            background: rgba(255, 170, 0, 0.2);
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 5px;
            border-radius: 8px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 170, 0, 0.1); }
        ::-webkit-scrollbar-thumb { background: #ffaa00; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>💱 GALACTIC MARKET</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">CREDITS: <span id="credits">1000</span></div>
            <div class="stat">TRADES: <span id="trades">0</span></div>
            <div class="stat">PROFIT: <span id="profit">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="market-area" id="marketArea"></div>
        
        <div class="sidebar">
            <h3 id="portfolioTitle">PORTFOLIO</h3>
            <div id="portfolioList"></div>
            <hr style="border: 1px solid #ffaa00; margin: 10px 0;">
            <h3>ACTIONS</h3>
            <button class="trade-btn" onclick="buyLow()">📈 Buy Low</button>
            <button class="trade-btn" onclick="sellHigh()">📉 Sell High</button>
        </div>
    </div>

    <script>
        const languages = {
            en: { portfolioTitle: 'PORTFOLIO' },
            hy: { portfolioTitle: 'ՊՈՐՏՖՈԼԻՈ' },
            ru: { portfolioTitle: 'ПОРТФЕЛЬ' },
            fr: { portfolioTitle: 'PORTEFEUILLE' },
            de: { portfolioTitle: 'PORTFOLIO' },
            es: { portfolioTitle: 'CARTERA' },
            ja: { portfolioTitle: 'ポートフォリオ' },
            zh: { portfolioTitle: '投资组合' },
            ar: { portfolioTitle: 'المحفظة' },
            pt: { portfolioTitle: 'CARTEIRA' }
        };

        let gameState = {
            credits: 1000,
            trades: 0,
            profit: 0,
            portfolio: {},
            commodities: [
                { name: 'Spice', price: 100, volatility: 0.1 },
                { name: 'Crystals', price: 150, volatility: 0.15 },
                { name: 'Metals', price: 80, volatility: 0.08 },
                { name: 'Energy', price: 120, volatility: 0.12 }
            ],
            language: 'en'
        };

        function renderMarket() {
            const area = document.getElementById('marketArea');
            area.innerHTML = '';
            gameState.commodities.forEach((com, idx) => {
                const div = document.createElement('div');
                div.className = 'commodity';
                const change = (Math.random() - 0.5) * com.volatility * com.price;
                com.price += change;
                com.price = Math.max(50, com.price);
                
                const chartWidth = (com.price / 200) * 100;
                div.innerHTML = `
                    <div class="commodity-name">${com.name}</div>
                    <div class="commodity-price">💰 ${com.price.toFixed(0)} credits</div>
                    <div class="commodity-chart">
                        <div class="chart-bar" style="width: ${chartWidth}%"></div>
                    </div>
                `;
                div.onclick = () => buyCommodity(idx);
                area.appendChild(div);
            });
        }

        function buyCommodity(idx) {
            const com = gameState.commodities[idx];
            if (gameState.credits >= com.price) {
                gameState.credits -= com.price;
                gameState.portfolio[com.name] = (gameState.portfolio[com.name] || 0) + 1;
                gameState.trades++;
                renderPortfolio();
                updateUI();
                saveGame();
            }
        }

        function buyLow() {
            const lowest = gameState.commodities.reduce((a, b) => a.price < b.price ? a : b);
            const idx = gameState.commodities.indexOf(lowest);
            buyCommodity(idx);
        }

        function sellHigh() {
            const highest = gameState.commodities.reduce((a, b) => a.price > b.price ? a : b);
            const name = highest.name;
            if (gameState.portfolio[name] > 0) {
                gameState.portfolio[name]--;
                gameState.credits += highest.price * 1.1;
                gameState.profit += highest.price * 0.1;
                gameState.trades++;
                renderPortfolio();
                updateUI();
                saveGame();
            }
        }

        function renderPortfolio() {
            const list = document.getElementById('portfolioList');
            list.innerHTML = '';
            Object.entries(gameState.portfolio).forEach(([name, qty]) => {
                if (qty > 0) {
                    const div = document.createElement('div');
                    div.className = 'portfolio';
                    div.innerHTML = `${name}: <span style="color: #00ff88;">${qty}x</span>`;
                    list.appendChild(div);
                }
            });
        }

        function updateUI() {
            document.getElementById('credits').textContent = Math.floor(gameState.credits);
            document.getElementById('trades').textContent = gameState.trades;
            document.getElementById('profit').textContent = Math.floor(gameState.profit);
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('portfolioTitle').textContent = languages[gameState.language].portfolioTitle;
        }

        function saveGame() {
            localStorage.setItem('galacticTrader2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('galacticTrader2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('portfolioTitle').textContent = languages[gameState.language].portfolioTitle;
        renderMarket();
        renderPortfolio();
        updateUI();

        setInterval(() => {
            renderMarket();
        }, 2000);
    </script>
</body>
</html>
