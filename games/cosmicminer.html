<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmic Miner - Industrial Mining</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(45deg, #1a1a2e, #0f3460);
            color: #00d4ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(15, 52, 96, 0.95);
            padding: 10px 15px;
            border-bottom: 3px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; }
        .back-btn {
            background: #00d4ff;
            border: none;
            color: #0f3460;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .back-btn:hover { box-shadow: 0 0 10px #00d4ff; }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 212, 255, 0.1);
            padding: 5px 10px;
            border: 1px solid #00d4ff;
            border-radius: 3px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .mining-area {
            flex: 1;
            background: linear-gradient(135deg, #0a0a1a, #1a1a3a);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 15px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            align-content: start;
        }
        .asteroid {
            aspect-ratio: 1;
            background: radial-gradient(circle at 30% 30%, #4a4a6a, #1a1a2a);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            transition: all 0.1s;
            position: relative;
            overflow: hidden;
        }
        .asteroid:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00d4ff;
        }
        .asteroid:active {
            transform: scale(0.95);
        }
        .asteroid-health {
            position: absolute;
            bottom: 2px;
            left: 2px;
            right: 2px;
            height: 3px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }
        .asteroid-health-bar {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00d4ff);
            width: 100%;
            transition: width 0.1s;
        }
        .sidebar {
            width: 250px;
            background: rgba(15, 52, 96, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 5px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #00d4ff;
            font-size: 14px;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 5px;
        }
        .tool {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            padding: 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .tool:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(3px);
        }
        .tool-name { color: #00ff88; font-weight: bold; }
        .tool-cost { color: #ffaa00; font-size: 10px; }
        .lang-select {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px;
            border-radius: 3px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⛏️ COSMIC MINER v2.0</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">ORE: <span id="ore">0</span></div>
            <div class="stat">ASTEROIDS: <span id="asteroids">5</span></div>
            <div class="stat">POWER: <span id="power">100</span>%</div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="mining-area" id="miningArea"></div>
        
        <div class="sidebar">
            <h3 id="toolsTitle">MINING TOOLS</h3>
            <div id="toolsList"></div>
            <hr style="border: 1px solid #00d4ff; margin: 10px 0;">
            <h3>STATS</h3>
            <div style="font-size: 11px; color: #aabbff;">
                <div>Asteroids Mined: <span id="mined">0</span></div>
                <div>Total Ore: <span id="totalOre">0</span></div>
                <div>Power Used: <span id="powerUsed">0</span>%</div>
            </div>
        </div>
    </div>

    <script>
        const languages = {
            en: { toolsTitle: 'MINING TOOLS', pickaxe: 'Pickaxe', pickaxeDesc: '+1 damage', drill: 'Drill', drillDesc: '+2 damage', laser: 'Laser', laserDesc: '+5 damage' },
            hy: { toolsTitle: 'ՀԱՆՔԱՅԻՆ ԳՈՐԾԻՔՆԵՐ', pickaxe: 'Կացնակ', pickaxeDesc: '+1 վնաս', drill: 'Բուր', drillDesc: '+2 վնաս', laser: 'Լազեր', laserDesc: '+5 վնաս' },
            ru: { toolsTitle: 'ГОРНЫЕ ИНСТРУМЕНТЫ', pickaxe: 'Кирка', pickaxeDesc: '+1 урон', drill: 'Бурав', drillDesc: '+2 урон', laser: 'Лазер', laserDesc: '+5 урон' },
            fr: { toolsTitle: 'OUTILS MINIERS', pickaxe: 'Pioche', pickaxeDesc: '+1 dégâts', drill: 'Foret', drillDesc: '+2 dégâts', laser: 'Laser', laserDesc: '+5 dégâts' },
            de: { toolsTitle: 'BERGBAU-WERKZEUGE', pickaxe: 'Spitzhacke', pickaxeDesc: '+1 Schaden', drill: 'Bohrer', drillDesc: '+2 Schaden', laser: 'Laser', laserDesc: '+5 Schaden' },
            es: { toolsTitle: 'HERRAMIENTAS MINERAS', pickaxe: 'Pico', pickaxeDesc: '+1 daño', drill: 'Taladro', drillDesc: '+2 daño', laser: 'Láser', laserDesc: '+5 daño' },
            ja: { toolsTitle: '採掘ツール', pickaxe: 'ツルハシ', pickaxeDesc: '+1ダメージ', drill: 'ドリル', drillDesc: '+2ダメージ', laser: 'レーザー', laserDesc: '+5ダメージ' },
            zh: { toolsTitle: '采矿工具', pickaxe: '镐', pickaxeDesc: '+1伤害', drill: '钻', drillDesc: '+2伤害', laser: '激光', laserDesc: '+5伤害' },
            ar: { toolsTitle: 'أدوات التعدين', pickaxe: 'معدن', pickaxeDesc: '+1 ضرر', drill: 'حفر', drillDesc: '+2 ضرر', laser: 'ليزر', laserDesc: '+5 ضرر' },
            pt: { toolsTitle: 'FERRAMENTAS DE MINERAÇÃO', pickaxe: 'Picareta', pickaxeDesc: '+1 dano', drill: 'Broca', drillDesc: '+2 dano', laser: 'Laser', laserDesc: '+5 dano' }
        };

        let gameState = {
            ore: 0,
            asteroids: [],
            power: 100,
            damagePerClick: 1,
            language: 'en'
        };

        const tools = [
            { id: 'pickaxe', cost: 50, langKey: 'pickaxe', descKey: 'pickaxeDesc', damage: 1 },
            { id: 'drill', cost: 150, langKey: 'drill', descKey: 'drillDesc', damage: 2 },
            { id: 'laser', cost: 500, langKey: 'laser', descKey: 'laserDesc', damage: 5 }
        ];

        function initAsteroids() {
            gameState.asteroids = [];
            for (let i = 0; i < 5; i++) {
                gameState.asteroids.push({
                    id: i,
                    health: 100,
                    maxHealth: 100,
                    ore: Math.floor(Math.random() * 50) + 20
                });
            }
            renderAsteroids();
        }

        function renderAsteroids() {
            const area = document.getElementById('miningArea');
            area.innerHTML = '';
            gameState.asteroids.forEach(ast => {
                const div = document.createElement('div');
                div.className = 'asteroid';
                div.innerHTML = `
                    <div style="text-align: center;">
                        <div>🪨</div>
                        <div style="font-size: 10px; color: #ffaa00;">${ast.health}/${ast.maxHealth}</div>
                    </div>
                    <div class="asteroid-health">
                        <div class="asteroid-health-bar" style="width: ${(ast.health / ast.maxHealth) * 100}%"></div>
                    </div>
                `;
                div.onclick = () => mineAsteroid(ast);
                area.appendChild(div);
            });
        }

        function mineAsteroid(ast) {
            if (gameState.power < 5) return;
            
            ast.health -= gameState.damagePerClick;
            gameState.power -= 5;
            
            if (ast.health <= 0) {
                gameState.ore += ast.ore;
                gameState.asteroids = gameState.asteroids.filter(a => a.id !== ast.id);
                if (gameState.asteroids.length === 0) {
                    initAsteroids();
                }
            }
            
            gameState.power = Math.min(100, gameState.power + 2);
            updateUI();
            renderAsteroids();
            saveGame();
        }

        function renderTools() {
            const list = document.getElementById('toolsList');
            list.innerHTML = '';
            tools.forEach(tool => {
                const cost = Math.ceil(tool.cost * Math.pow(1.3, tool.count || 0));
                const canAfford = gameState.ore >= cost;
                const div = document.createElement('div');
                div.className = `tool ${!canAfford ? 'disabled' : ''}`;
                div.style.opacity = canAfford ? '1' : '0.5';
                div.innerHTML = `
                    <div class="tool-name">${languages[gameState.language][tool.langKey]}</div>
                    <div style="color: #aabbff; font-size: 10px;">${languages[gameState.language][tool.descKey]}</div>
                    <div class="tool-cost">Cost: ${cost} ORE</div>
                `;
                if (canAfford) {
                    div.onclick = () => buyTool(tool);
                }
                list.appendChild(div);
            });
        }

        function buyTool(tool) {
            const cost = Math.ceil(tool.cost * Math.pow(1.3, tool.count || 0));
            if (gameState.ore >= cost) {
                gameState.ore -= cost;
                tool.count = (tool.count || 0) + 1;
                gameState.damagePerClick += tool.damage;
                renderTools();
                updateUI();
                saveGame();
            }
        }

        function updateUI() {
            document.getElementById('ore').textContent = gameState.ore;
            document.getElementById('asteroids').textContent = gameState.asteroids.length;
            document.getElementById('power').textContent = Math.floor(gameState.power);
            document.getElementById('totalOre').textContent = gameState.ore;
            document.getElementById('powerUsed').textContent = Math.floor(100 - gameState.power);
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('toolsTitle').textContent = languages[gameState.language].toolsTitle;
            renderTools();
        }

        function saveGame() {
            localStorage.setItem('cosmicMiner2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('cosmicMiner2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            } else {
                initAsteroids();
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('toolsTitle').textContent = languages[gameState.language].toolsTitle;
        renderTools();
        updateUI();
        renderAsteroids();

        setInterval(() => {
            gameState.power = Math.min(100, gameState.power + 0.5);
            updateUI();
        }, 1000);
    </script>
</body>
</html>
