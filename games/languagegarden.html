<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Language Garden · 200+ Languages</title>
    <style>
        :root {
            --bg: #1a2f1f;
            --panel: rgba(25, 35, 25, 0.7);
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.12);
            --gold: #f5d742;
            --leaf: #9bce7b;
            --text: #e6e8d8;
            --textSoft: #b7bc9a;
            --accent: #f0e6a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Noto Sans Armenian', system-ui, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #2d4a2a 0%, #1a2f1f 70%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-layer {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .bg-layer::before {
            content: ""; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 40%;
            background: linear-gradient(transparent, rgba(60, 90, 50, 0.15));
            border-radius: 50% 50% 0 0;
        }
        .clouds {
            position: absolute; top: 10%; left: 5%;
            width: 200px; height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50px; filter: blur(12px);
            animation: drift 25s ease-in-out infinite;
        }
        .clouds:nth-child(2) { top: 25%; left: 60%; animation-delay: -10s; width: 160px; }
        @keyframes drift {
            0% { transform: translateX(0); } 50% { transform: translateX(50px); } 100% { transform: translateX(0); }
        }
        .particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .spark {
            position: absolute; width: 4px; height: 4px;
            background: #f9f3b0; border-radius: 50%;
            animation: floatUp 7s ease-in infinite; opacity: 0;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0); }
            15% { opacity: 0.8; } 50% { opacity: 0.4; transform: translateY(-160px) scale(1.4); }
            100% { opacity: 0; transform: translateY(-340px) scale(0.2); }
        }

        .main-container {
            position: relative; z-index: 2;
            width: 100%; max-width: 1000px; padding: 20px;
            display: flex; flex-direction: column; gap: 16px;
            margin: 0 auto;
        }

        .top-row {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .nav-btn {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--glass); border: 1px solid var(--border);
            color: var(--textSoft); padding: 8px 18px; border-radius: 30px;
            text-decoration: none; font-size: 0.85rem;
            backdrop-filter: blur(12px); width: fit-content;
            transition: all 0.3s; letter-spacing: 0.5px; cursor: pointer;
        }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.3); color: white; transform: translateY(-2px); }

        .save-indicator {
            font-size: 0.7rem; color: #7a9e6e; letter-spacing: 0.6px;
            transition: opacity 0.4s;
        }

        .header { text-align: center; margin-top: 4px; }
        .title { font-size: 2.4rem; font-weight: 600; color: #eef5d8; letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(150, 200, 100, 0.4); }
        .subtitle { font-size: 0.9rem; color: #b7c99e; letter-spacing: 0.8px; }

        .stats-panel { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .stat-box {
            flex: 1; min-width: 80px; background: var(--panel);
            backdrop-filter: blur(16px); border: 1px solid var(--border);
            border-radius: 16px; padding: 14px 12px; text-align: center; color: var(--text);
        }
        .stat-value { font-size: 1.7rem; font-weight: 700; color: #f0e68c; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--textSoft); }

        .garden-center { display: flex; justify-content: center; margin: 8px 0; }
        .click-orb {
            width: 100px; height: 100px;
            background: radial-gradient(circle at 30% 30%, #ffeaa0, #e0b040);
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(255, 220, 100, 0.7), 0 0 10px rgba(255, 200, 50, 0.9);
            cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.4rem; color: #4a3a10;
            animation: pulseGlow 2.5s ease-in-out infinite;
        }
        .click-orb:active { transform: scale(0.88); box-shadow: 0 0 60px #ffdd55; }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 220, 100, 0.6); }
            50% { box-shadow: 0 0 55px rgba(255, 220, 100, 0.9); }
        }
        .click-hint { text-align: center; color: var(--textSoft); font-size: 0.8rem; margin-top: 2px; }

        .garden-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 10px; margin-top: 8px;
            max-height: 60vh; overflow-y: auto; padding: 5px;
        }
        .flower-card {
            background: var(--panel); backdrop-filter: blur(10px);
            border: 1px solid var(--border); border-radius: 18px;
            padding: 10px 6px; text-align: center; transition: all 0.4s;
            cursor: pointer; position: relative;
        }
        .flower-card.locked { filter: grayscale(0.5) brightness(0.75); opacity: 0.8; }
        .flower-card.unlocked { border-color: rgba(180, 210, 120, 0.4);
            box-shadow: 0 4px 20px rgba(120, 180, 60, 0.25); }
        .flower-emoji { font-size: 2rem; margin-bottom: 2px; transition: transform 0.3s; }
        .flower-card.unlocked:hover .flower-emoji { transform: scale(1.1); }
        .lang-name { font-size: 0.75rem; font-weight: 600; color: var(--text); }
        .lang-level { font-size: 0.6rem; color: var(--textSoft); margin-top: 2px; }
        .flower-card.locked .lang-name,
        .flower-card.locked .lang-level { color: #9aa08a; }
        .unlock-cost, .upgrade-cost { font-size: 0.6rem; margin-top: 4px; color: #d4c06a; font-weight: 500; }

        .footer-note { text-align: center; font-size: 0.7rem; color: #88976e;
            letter-spacing: 0.6px; margin-top: 2px; }

        @media (max-width: 600px) {
            .garden-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
            .title { font-size: 1.8rem; }
        }
    </style>
</head>

                { id: 'art', name: 'Lojban', native: 'la .lojban.', flag: '🌐' },
            ];

            // ─────────────────────────────────────
            // LOCAL STORAGE SAVE / LOAD
            // ─────────────────────────────────────
            const SAVE_KEY = 'languageGarden_save_v1';

            function saveGame() {
                const unlockedData = {};
                for (const [id, data] of unlockedLanguages.entries()) {
                    unlockedData[id] = { level: data.level, epsContribution: data.epsContribution };
                }
                const saveObj = {
                    essence: essence,
                    unlockedLanguages: unlockedData,
                    unlockPriceMultiplier: unlockPriceMultiplier,
                    lastSaved: Date.now(),
                };
                try {
                    localStorage.setItem(SAVE_KEY, JSON.stringify(saveObj));
                    showSavedIndicator();
                } catch (e) {
                    console.warn('Could not save game:', e);
                }
            }

            function loadGame() {
                try {
                    const raw = localStorage.getItem(SAVE_KEY);
                    if (!raw) return false;
                    const saveObj = JSON.parse(raw);
                    essence = saveObj.essence ?? 10;
                    unlockPriceMultiplier = saveObj.unlockPriceMultiplier ?? 1.0;
                    unlockedLanguages.clear();
                    if (saveObj.unlockedLanguages) {
                        for (const [id, data] of Object.entries(saveObj.unlockedLanguages)) {
                            unlockedLanguages.set(id, {
                                level: data.level || 1,
                                epsContribution: data.epsContribution || 0.08,
                            });
                        }
                    }
                    return true;
                } catch (e) {
                    console.warn('Could not load save, starting fresh:', e);
                    return false;
                }
            }

            function showSavedIndicator() {
                const indicator = document.getElementById('saveIndicator');
                indicator.textContent = '💾 saved';
                indicator.style.opacity = '1';
                setTimeout(() => {
                    indicator.textContent = '💾 auto-saved';
                    indicator.style.opacity = '0.7';
                }, 800);
            }

            // ─────────────────────────────────────
            // GAME STATE
            // ─────────────────────────────────────
            let essence = 10;
            const essencePerClick = 1;
            let essencePerSecond = 0;
            let unlockedLanguages = new Map();
            let unlockPriceMultiplier = 1.0;
            const baseUnlockCost = 10;
            const levelBaseCost = 25;

            // Initialize English if not loaded
            if (!unlockedLanguages.has('en')) {
                unlockedLanguages.set('en', { level: 1, epsContribution: 0.1 });
            }

            // ─────────────────────────────────────
            // DOM ELEMENTS
            // ─────────────────────────────────────
            const essenceDisplay = document.getElementById('essenceDisplay');
            const epsDisplay = document.getElementById('epsDisplay');
            const totalUnlockedDisplay = document.getElementById('totalUnlockedDisplay');
            const multiplierDisplay = document.getElementById('multiplierDisplay');
            const gardenGrid = document.getElementById('gardenGrid');
            const clickOrb = document.getElementById('clickOrb');
            const particlesContainer = document.getElementById('particles');

            // ─────────────────────────────────────
            // FUNCTIONS
            // ─────────────────────────────────────
            function getCurrentUnlockCost() {
                return Math.floor(baseUnlockCost * unlockPriceMultiplier);
            }

            function getLevelUpCost(langId) {
                const lang = unlockedLanguages.get(langId);
                if (!lang) return 0;
                return Math.floor(levelBaseCost * Math.pow(1.6, lang.level));
            }

            function recalcEPS() {
                let total = 0;
                for (const [, data] of unlockedLanguages) {
                    total += data.epsContribution * data.level;
                }
                essencePerSecond = total;
                epsDisplay.textContent = essencePerSecond.toFixed(1);
            }

            function updateUI() {
                essenceDisplay.textContent = Math.floor(essence);
                totalUnlockedDisplay.textContent = unlockedLanguages.size;
                multiplierDisplay.textContent = unlockPriceMultiplier.toFixed(2);
                recalcEPS();
                renderGarden();
            }

            function renderGarden() {
                gardenGrid.innerHTML = '';
                languages.forEach(lang => {
                    const isUnlocked = unlockedLanguages.has(lang.id);
                    const card = document.createElement('div');
                    card.className = `flower-card ${isUnlocked ? 'unlocked' : 'locked'}`;
                    card.dataset.lang = lang.id;

                    const emojiDiv = document.createElement('div');
                    emojiDiv.className = 'flower-emoji';
                    emojiDiv.textContent = lang.flag;

                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'lang-name';
                    nameDiv.textContent = lang.native || lang.name;

                    const levelDiv = document.createElement('div');
                    levelDiv.className = 'lang-level';

                    const costDiv = document.createElement('div');
                    costDiv.className = isUnlocked ? 'upgrade-cost' : 'unlock-cost';

                    if (isUnlocked) {
                        const data = unlockedLanguages.get(lang.id);
                        levelDiv.textContent = `Lv. ${data.level}`;
                        costDiv.textContent = `⬆️ ${getLevelUpCost(lang.id)} essence`;
                        card.addEventListener('click', () => upgradeLanguage(lang.id));
                    } else {
                        levelDiv.textContent = '🔒 locked';
                        const cost = getCurrentUnlockCost();
                        costDiv.textContent = `🔓 ${cost} essence`;
                        card.addEventListener('click', () => unlockLanguage(lang.id));
                    }

                    card.appendChild(emojiDiv);
                    card.appendChild(nameDiv);
                    card.appendChild(levelDiv);
                    card.appendChild(costDiv);
                    gardenGrid.appendChild(card);
                });
            }

            function unlockLanguage(langId) {
                if (unlockedLanguages.has(langId)) return;
                const cost = getCurrentUnlockCost();
                if (essence < cost) return;
                essence -= cost;
                unlockedLanguages.set(langId, { level: 1, epsContribution: 0.08 });
                unlockPriceMultiplier *= 1.01;
                createClickBurst();
                updateUI();
                saveGame();
            }

            function upgradeLanguage(langId) {
                const langData = unlockedLanguages.get(langId);
                if (!langData) return;
                const cost = getLevelUpCost(langId);
                if (essence < cost) return;
                essence -= cost;
                langData.level += 1;
                langData.epsContribution = Math.min(0.5, langData.epsContribution + 0.02);
                updateUI();
                createClickBurst();
                saveGame();
            }

            // ─────────────────────────────────────
            // EVENT LISTENERS
            // ─────────────────────────────────────
            clickOrb.addEventListener('click', (e) => {
                essence += essencePerClick;
                updateUI();
                createClickParticles(e.clientX, e.clientY);
                clickOrb.style.transform = 'scale(0.9)';
                setTimeout(() => { clickOrb.style.transform = ''; }, 120);
                saveGame();
            });

            function createClickParticles(x, y) {
                for (let i = 0; i < 6; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    spark.style.left = (x + (Math.random() - 0.5) * 30) + 'px';
                    spark.style.top = (y + (Math.random() - 0.5) * 30) + 'px';
                    spark.style.animationDuration = (1 + Math.random() * 1.5) + 's';
                    spark.style.background = '#f9e076';
                    particlesContainer.appendChild(spark);
                    setTimeout(() => spark.remove(), 1500);
                }
            }

            function createClickBurst() {
                const cx = window.innerWidth / 2,
                    cy = window.innerHeight / 2;
                for (let i = 0; i < 10; i++) {
                    const spark = document.createElement('div');
                    spark.className = 'spark';
                    spark.style.left = (cx + (Math.random() - 0.5) * 180) + 'px';
                    spark.style.top = (cy + (Math.random() - 0.5) * 120) + 'px';
                    spark.style.animationDuration = (0.8 + Math.random() * 1) + 's';
                    spark.style.background = '#e0f0a0';
                    particlesContainer.appendChild(spark);
                    setTimeout(() => spark.remove(), 1400);
                }
            }

            // ─────────────────────────────────────
            // PASSIVE INCOME LOOP
            // ─────────────────────────────────────
            let saveCounter = 0;
            setInterval(() => {
                if (essencePerSecond > 0) {
                    essence += essencePerSecond / 10;
                    updateUI();
                }
                saveCounter++;
                if (saveCounter >= 50) {
                    saveCounter = 0;
                    saveGame();
                }
            }, 100);

            // ─────────────────────────────────────
            // AMBIENT SPARKLES
            // ─────────────────────────────────────
            for (let i = 0; i < 22; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = Math.random() * 100 + '%';
                spark.style.top = (60 + Math.random() * 40) + '%';
                spark.style.animationDelay = Math.random() * 8 + 's';
                spark.style.animationDuration = (5 + Math.random() * 7) + 's';
                particlesContainer.appendChild(spark);
            }

            // ─────────────────────────────────────
            // INIT
            // ─────────────────────────────────────
            const loaded = loadGame();
            if (!loaded) {
                unlockedLanguages.set('en', { level: 1, epsContribution: 0.1 });
                saveGame();
            }
            updateUI();
            console.log(
                '🌍 Language Garden ready — 200+ languages, progress saved on your device'
                );
            console.log('💾 Save key:', SAVE_KEY);
            console.log('📂 Place in /games/ folder, nav button links to ../index.html');
        })();
