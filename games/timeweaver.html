<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Time Weaver - Timeline Builder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Trebuchet MS', sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #16213e);
            color: #00d4ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(10, 10, 46, 0.95);
            padding: 10px 15px;
            border-bottom: 2px solid #00d4ff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 { font-size: 20px; color: #00d4ff; text-shadow: 0 0 10px #00d4ff; }
        .back-btn {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .stats {
            display: flex;
            gap: 15px;
            font-size: 12px;
            flex-wrap: wrap;
        }
        .stat {
            background: rgba(0, 212, 255, 0.1);
            padding: 5px 10px;
            border: 1px solid #00d4ff;
            border-radius: 5px;
        }
        .container {
            display: flex;
            flex: 1;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .timeline-area {
            flex: 1;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.05), rgba(0, 100, 150, 0.05));
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .timeline-row {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .timeline-row:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(5px);
        }
        .timeline-row.active {
            background: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 15px #00d4ff;
        }
        .timeline-time {
            color: #ffaa00;
            font-weight: bold;
            min-width: 60px;
        }
        .timeline-event {
            flex: 1;
            color: #aabbff;
            font-size: 13px;
        }
        .timeline-action {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            color: #00d4ff;
            transition: all 0.2s;
        }
        .timeline-action:hover {
            background: rgba(0, 212, 255, 0.4);
        }
        .sidebar {
            width: 200px;
            background: rgba(10, 10, 46, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar h3 {
            color: #00d4ff;
            font-size: 13px;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 5px;
        }
        .action-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
        }
        .action-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            transform: translateX(3px);
        }
        .lang-select {
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            padding: 5px;
            border-radius: 5px;
            font-size: 11px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>⏰ TIMELINE EDITOR</h1>
        <button class="back-btn" onclick="goHome()">← HOME</button>
        <div class="stats">
            <div class="stat">TIME: <span id="time">0</span></div>
            <div class="stat">EVENTS: <span id="events">0</span></div>
            <div class="stat">LOOPS: <span id="loops">0</span></div>
        </div>
        <select class="lang-select" id="langSelect" onchange="changeLanguage()">
            <option value="en">EN</option>
            <option value="hy">ՀԱ</option>
            <option value="ru">РУ</option>
            <option value="fr">FR</option>
            <option value="de">DE</option>
            <option value="es">ES</option>
            <option value="ja">JA</option>
            <option value="zh">ZH</option>
            <option value="ar">AR</option>
            <option value="pt">PT</option>
        </select>
    </div>
    
    <div class="container">
        <div class="timeline-area" id="timelineArea"></div>
        
        <div class="sidebar">
            <h3 id="actionsTitle">ACTIONS</h3>
            <button class="action-btn" onclick="addEvent()">+ Add Event</button>
            <button class="action-btn" onclick="createLoop()">⟳ Create Loop</button>
            <button class="action-btn" onclick="rewindTime()">⏮ Rewind</button>
            <hr style="border: 1px solid #00d4ff; margin: 10px 0;">
            <h3>STATS</h3>
            <div style="font-size: 11px; color: #aabbff;">
                <div>Total Events: <span id="totalEvents">0</span></div>
                <div>Loops Created: <span id="totalLoops">0</span></div>
            </div>
        </div>
    </div>

    <script>
        const languages = {
            en: { actionsTitle: 'ACTIONS' },
            hy: { actionsTitle: 'ԳՈՐԾՈՂՈՒԹՅՈՒՆՆԵՐ' },
            ru: { actionsTitle: 'ДЕЙСТВИЯ' },
            fr: { actionsTitle: 'ACTIONS' },
            de: { actionsTitle: 'AKTIONEN' },
            es: { actionsTitle: 'ACCIONES' },
            ja: { actionsTitle: 'アクション' },
            zh: { actionsTitle: '操作' },
            ar: { actionsTitle: 'الإجراءات' },
            pt: { actionsTitle: 'AÇÕES' }
        };

        let gameState = {
            time: 0,
            events: [],
            loops: 0,
            language: 'en'
        };

        const eventTypes = ['⚡ Power Surge', '🌊 Wave', '💫 Spark', '🔥 Burst', '❄️ Freeze'];

        function addEvent() {
            const event = {
                id: Date.now(),
                time: gameState.time,
                type: eventTypes[Math.floor(Math.random() * eventTypes.length)],
                active: false
            };
            gameState.events.push(event);
            gameState.time++;
            renderTimeline();
            updateUI();
            saveGame();
        }

        function createLoop() {
            if (gameState.events.length > 0) {
                gameState.loops++;
                gameState.time += 5;
                renderTimeline();
                updateUI();
                saveGame();
            }
        }

        function rewindTime() {
            if (gameState.time > 0) {
                gameState.time -= 1;
                gameState.events = gameState.events.filter(e => e.time <= gameState.time);
                renderTimeline();
                updateUI();
                saveGame();
            }
        }

        function renderTimeline() {
            const area = document.getElementById('timelineArea');
            area.innerHTML = '';
            gameState.events.forEach(event => {
                const div = document.createElement('div');
                div.className = 'timeline-row';
                if (event.active) div.classList.add('active');
                div.innerHTML = `
                    <div class="timeline-time">T+${event.time}</div>
                    <div class="timeline-event">${event.type}</div>
                    <div class="timeline-action" onclick="toggleEvent(${event.id})">Toggle</div>
                    <div class="timeline-action" onclick="deleteEvent(${event.id})">✕</div>
                `;
                area.appendChild(div);
            });
        }

        function toggleEvent(id) {
            const event = gameState.events.find(e => e.id === id);
            if (event) {
                event.active = !event.active;
                renderTimeline();
                saveGame();
            }
        }

        function deleteEvent(id) {
            gameState.events = gameState.events.filter(e => e.id !== id);
            renderTimeline();
            updateUI();
            saveGame();
        }

        function updateUI() {
            document.getElementById('time').textContent = gameState.time;
            document.getElementById('events').textContent = gameState.events.length;
            document.getElementById('loops').textContent = gameState.loops;
            document.getElementById('totalEvents').textContent = gameState.events.length;
            document.getElementById('totalLoops').textContent = gameState.loops;
        }

        function changeLanguage() {
            gameState.language = document.getElementById('langSelect').value;
            document.getElementById('actionsTitle').textContent = languages[gameState.language].actionsTitle;
        }

        function saveGame() {
            localStorage.setItem('timeWeaver2', JSON.stringify(gameState));
        }

        function loadGame() {
            const saved = localStorage.getItem('timeWeaver2');
            if (saved) {
                gameState = JSON.parse(saved);
                document.getElementById('langSelect').value = gameState.language;
            }
        }

        function goHome() {
            window.location.href = '../index.html';
        }

        loadGame();
        document.getElementById('actionsTitle').textContent = languages[gameState.language].actionsTitle;
        renderTimeline();
        updateUI();
    </script>
</body>
</html>
