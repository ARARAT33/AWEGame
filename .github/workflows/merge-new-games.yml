name: Merge AWEGame new-games branch

on:
  push:
    branches: [Real]

permissions:
  contents: write

jobs:
  merge-new-games:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Real
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge new-games branch without losing Real
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin add-three-new-games-560284916545043946

          if git merge-base --is-ancestor origin/add-three-new-games-560284916545043946 HEAD; then
            echo "Branch already merged; nothing to do."
            exit 0
          fi

          if git merge --no-commit --no-ff origin/add-three-new-games-560284916545043946; then
            echo "Clean merge."
          else
            echo "Expected conflicts in games.js/index.html; preserve Real and apply only the branch additions."
            git checkout --ours games.js index.html
            git add games.js index.html

            python3 - <<'PY'
            from pathlib import Path

            games = Path('games.js')
            text = games.read_text(encoding='utf-8')
            additions = [
                '  {title:"⚔️ Cyber Sword Duel 1v1 P2P",folder:"cybersword.html",description:"Real-time 1v1 cyberpunk samurai sword combat arena featuring WebRTC P2P state sync, live text chat, voice chat with mic visualizer, single-player AI ronin mode, katana forge shop, LocalStorage stats saving, and 11-language support!",developer:"AWEGames",icon:"⚔️🎙️"},',
                '  {title:"🪐 Cyber Planet Colony Builder",folder:"cyberpioneer.html",description:"Sci-fi colony survival and dome expansion simulator with resource management, power grid placement, bio-dome ecology, terraforming progression, LocalStorage auto-save, and 11-language support!",developer:"AWEGames",icon:"🪐⚡"},',
                '  {title:"🧬 Cyber Beast Evolution RPG",folder:"cyberbeast.html",description:"Cybernetic creature hatching, mutation, and tactical battle RPG featuring DNA evolution stages, sector arena progression, LocalStorage save system, and 11-language support!",developer:"AWEGames",icon:"🧬💥"}'
            ]
            if 'folder:"cybersword.html"' not in text:
                marker = '\n];'
                if marker not in text:
                    raise SystemExit('games.js closing marker not found')
                text = text.replace(marker, '\n' + '\n'.join(additions) + '\n];', 1)
                games.write_text(text, encoding='utf-8')

            index = Path('index.html')
            text = index.read_text(encoding='utf-8')
            text = text.replace('v2026,03,30,15.awe.version.game.public', 'v2026,03,31,12.awe.version.game.public')
            index.write_text(text, encoding='utf-8')
            PY
            git add games.js index.html
          fi

          # The three new HTML game files come directly from the requested branch.
          git checkout --theirs games/cybersword.html games/cyberpioneer.html games/cyberbeast.html
          git add games/cybersword.html games/cyberpioneer.html games/cyberbeast.html

          git diff --cached --check
          git commit -m "Merge 3 new AWEGame titles into Real without losing existing changes"
          git push origin HEAD:Real

      - name: Remove temporary merge workflow
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/merge-new-games.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/merge-new-games.yml
          git commit -m "Remove temporary merge workflow" || exit 0
          git push origin HEAD:Real
