<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWEGame — Game Library</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;padding:20px}
.wrapper{max-width:1200px;margin:0 auto}
h1{text-align:center;font-size:2.5em;margin-bottom:8px;background:linear-gradient(135deg,#58a6ff,#bc8cff,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{text-align:center;color:#8b949e;margin-bottom:32px;font-size:1.1em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-4px);border-color:#58a6ff;box-shadow:0 8px 30px rgba(88,166,255,.15)}
.card .icon{font-size:48px;margin-bottom:12px}
.card .title{font-size:1.2em;font-weight:700;margin-bottom:6px}
.card .desc{font-size:.85em;color:#8b949e;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .dev{font-size:.75em;color:#58a6ff;margin-top:10px}
</style>
</head>
<body>
<div class="wrapper">
<h1>AWEGame</h1>
<p class="subtitle">Game Library — Click any game to play</p>
<div class="grid" id="grid"></div>
</div>
<script src="games.js"></script>
<script>
if(typeof games!=='undefined'){
  document.getElementById('grid').innerHTML=games.map(g=>`
    <a href="games/${g.folder}" class="card">
      <div class="icon">${g.icon||'🎮'}</div>
      <div class="title">${g.title}</div>
      <div class="desc">${g.description||''}</div>
      <div class="dev">by ${g.developer||'AWEGames'}</div>
    </a>
  `).join('');
}
</script>
</body>
</html>
